function payAll(res){  
  if(!res) return null; if(res.pay_all) return res.pay_all; const o={}, p=res.pay||{};
  if(res.tansho&&res.order&&res.order.length) o['単勝']=[{c:String(res.order[0]),y:res.tansho}];
  if(p.fuku&&Object.keys(p.fuku).length) o['複勝']=Object.keys(p.fuku).map(u=>({c:u,y:p.fuku[u]}));
  if(p.wide&&Object.keys(p.wide).length) o['ワイド']=Object.keys(p.wide).map(c=>({c,y:p.wide[c]}));
  return Object.keys(o).length?o:null; }
function tkComb(t,hs){ const u=t.idx.map(i=>hs[i]&&hs[i].uno); return (t.type==='馬単'||t.type==='3連単')?u.join('>'):[...u].sort((a,b)=>a-b).join('-'); }

    <div class="sec" id="q-faq">${SH('check',0,'よくある質問','FAQ')}<div class="faq">

let COLS=[]; try{ COLS=[{"id": "tokyo2000-waku", "date": "2026-10-28", "title": "東京芝2000mの外枠は本当に不利？", "lead": "天皇賞秋の舞台、東京芝2000m。外枠は不利と言われますが、人気はそれをどこまで知っているのか。2000年からの977レースで確かめると、クラスで答えが変わりました。", "html": "<style>\n.epc{display:block;width:100%;height:auto;margin:6px 0 2px}\n.epc,.epc text,.epc tspan{letter-spacing:0!important;word-spacing:0}.epc text{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}.epc .n{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}\n.epc .ink{fill:#111}.epc .mu{fill:#8a8a86}.epc .nvf{fill:#26305e}.epc .gdf{fill:#b08a1e}.epc .gyf{fill:#a3a29b}.epc .ltf{fill:#c9cee0}.epc .lgf{fill:#d6d5cf}\n.epc .grid{stroke:#ecebe5}.epc .zero{stroke:#b9b8b1}.epc .nvs{stroke:#26305e}.epc .gds{stroke:#b08a1e}.epc .gys{stroke:#a3a29b}.epc .bg{fill:#fff}\n.epf{margin:22px 0 4px}.epf b{display:block;font-size:13px;font-weight:800;line-height:1.5}.epf small{display:block;font-size:10.5px;color:#8a8a86;line-height:1.6;margin-top:2px}\nhtml[data-theme=dark] .epc .ink{fill:#ececea}html[data-theme=dark] .epc .nvf{fill:#aab3e6}html[data-theme=dark] .epc .ltf{fill:#3a3f55}html[data-theme=dark] .epc .lgf{fill:#4a4d55}\nhtml[data-theme=dark] .epc .grid{stroke:#2c2f36}html[data-theme=dark] .epc .zero{stroke:#5f636b}html[data-theme=dark] .epc .nvs{stroke:#aab3e6}html[data-theme=dark] .epc .gdf{fill:#e0b84f}html[data-theme=dark] .epc .gds{stroke:#e0b84f}html[data-theme=dark] .epc .bg{fill:#1a1c21}\n.ept{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:11.5px;letter-spacing:0}\n.ept th{font-size:10px;font-weight:700;color:#8a8a86;text-align:right;padding:4px 3px 6px;white-space:nowrap;border-bottom:1px solid #e6e5df}\n.ept th:first-child,.ept td:first-child{text-align:left}\n.ept td{text-align:right;padding:6px 3px;border-bottom:1px solid #f0efea;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;white-space:nowrap}\n.ept td:first-child{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-weight:7 =\"700\" class=\"ink\">外（7・8枠）<\/text><\/svg><p>東京のほかの距離と比べると、<span style=\"white-space:nowrap\">2000m<\/span>は内と外の差がいちばん大きいコースです。人気と比べると、内枠は<span style=\"white-space:nowrap\">100走<\/span>あたり<span style=\"white-space:nowrap\">2.5頭<\/span>多く、外枠は<span style=\"white-space:nowrap\">0.7頭<\/span>少ない。<span style=\"white-space:nowrap\">1600m<\/span>では、内も外もほぼ人気どおりです。<\/p><p>全部まとめると「外枠は少し不利だが、人気もそれを知っている」。ここまでなら、よくある結論です。ところがクラスで分けると、まったく違う顔が出てきます。<\/p>", "sv": "cb460cc5", "paid": true, "plen": 1683}, {"id": "chokyo-market", "date": "2026-10-26", "title": "調教は効く、でも儲からない？", "lead": "追い切りが速い馬は、実際によく走ります。それでも調教を見て買っても、回収率はほとんど上がりません。2021年からの平地 約21万5千走で、その理由を確かめました。", "html": "<style>\n.epc{display:block;width:100%;height:auto;margin:6px 0 2px}\n.epc,.epc text,.epc tspan{letter-spacing:0!important;word-spacing:0}.epc text{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}.epc .n{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}\n.epc .ink{fill:#111}.epc .mu{fill:#8a8a86}.epc .nvf{fill:#26305e}.epc .gdf{fill:#b08a1e}.epc .gyf{fill:#a3a29b}.epc .ltf{fill:#c9cee0}.epc .lgf{fill:#d6d5cf}\n.epc .grid{stroke:#ecebe5}.epc .zero{stroke:#b9b8b1}.epc .nvs{stroke:#26305e}.epc .gds{stroke:#b08a1e}.epc .gys{stroke:#a3a29b}.epc .bg{fill:#fff}\n.epf{margin:22px 0 4px}.epf b{display:block;font-size:13px;font-weight:800;line-height:1.5}.epf small{display:block;font-size:10.5px;color:#8a8a86;line-height:1.6;margin-top:2px}\nhtml[data-theme=dark] .epc .ink{fill:#ececea}html[data-theme=dark] .epc .nvf{fill:#aab3e6}html[data-theme=dark] .epc .ltf{fill:#3a3f55}html[data-theme=dark] .epc .lgf{fill:#4a4d55}\nhtml[data-theme=dark] .epc .grid{stroke:#2c2f36}html[data-theme=dark] .epc .zero{stroke:#5f636b}html[data-theme=dark] .epc .nvs{stroke:#aab3e6}html[data-theme=dark] .epc .gdf{fill:#e0b84f}html[data-theme=dark] .epc .gds{stroke:#e0b84f}html[data-theme=dark] .epc .bg{fill:#1a1c21}\n.ept{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:11.5px;letter-spacing:0}\n.ept th{font-size:10px;font-weight:700;color:#8a8a86;text-align:right;padding:4px 3px 6px;white-space:nowrap;border-bottom:1px solid #e6e5df}\n.ept th:first-child,.ept td:first-child{text-align:left}\n.ept td{text-align:right;padding:6px 3px;border-bottom:1px solid #f0efea;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;white-space:nowrap}\n.ept td:first-child{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-weight:700}\n.ept small{display:block;color:#8a8a86;font-size:9.5px;font-weight:400;line-height:1.3;font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}\nhtml[data-theme=dark] .ept th{color:#8d9097;border-bottom-color:#2c2f36}html[data-theme=dark] .ept td{border-bottom-color:#24262c}\n<\/style><p>追い切りの時計が速い。終いが<span style=\"white-space:nowrap\">11秒<\/span>台。本数をしっかり乗っている。調教欄を見て「今回は仕上がっている」と買う人は多いと思います。<\/p><p>ここには2つの問いがあります。調教が良い馬は本当によく走るのか。そして、それを見て買うと得をするのか。<span style=\"white-space:nowrap\">2021年<\/span><span style=\"white-space:nowrap\">8月<\/span>から<span style=\"white-space:nowrap\">2026年<\/span><span style=\"white-space:nowrap\">10月<\/span>までの平地の出走のうち、追い切りの記録がある約<span style=\"white-space:nowrap\">21万5千走<\/span>で確かめました。<\/p><p>物差しは、<span style=\"white-space:nowrap\">100走<\/span>あたりで3着内に来た頭数です。比べる相手は、単勝の人気から見込める頭数。実際がこれを上回れば、人気以上に走ったことになります。<\/p><h4>調教は、ちゃんと効いている<\/h4><div class=\"epf\"><b>図1　追い切りの速さと3着内<\/b><small>100走あたり、3着内に来た頭数。ふだんの時計と比べた速さで、出走を同じ数ずつ5つに分けた<\/small><\/div><svg class=\"epc\" viewBox=\"0 0 360 226\" role=\"img\"><line x1=\"34\" y1=\"184.0\" x2=\"354\" y2=\"184.0\" class=\"zero\" stroke-width=\"1.2\"/><text x=\"28\" y=\"187.5\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">0<\/text><line x1=\"34\" y1=\"127.3\" x2=\"354\" y2=\"127.3\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"28\" y=\"130.8\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">10<\/text><line x1=\"34\" y1=\"70.7\" x2=\"354\" y2=\"70.7\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"28\" y=\"74.2\" text-anchor=\" ircle cx=\"200.1\" cy=\"65.3\" r=\"4.4\" class=\"bg\"/><circle cx=\"200.1\" cy=\"65.3\" r=\"3.2\" class=\"gdf\"/><circle cx=\"238.6\" cy=\"51.8\" r=\"4.4\" class=\"bg\"/><circle cx=\"238.6\" cy=\"51.8\" r=\"3.2\" class=\"gdf\"/><circle cx=\"277.1\" cy=\"65.3\" r=\"4.4\" class=\"bg\"/><circle cx=\"277.1\" cy=\"65.3\" r=\"3.2\" class=\"gdf\"/><circle cx=\"315.6\" cy=\"92.5\" r=\"4.4\" class=\"bg\"/><circle cx=\"315.6\" cy=\"92.5\" r=\"3.2\" class=\"gdf\"/><text x=\"323.6\" y=\"89.0\" font-size=\"10.5\" font-weight=\"800\" class=\"gdf\">中距離<\/text><polyline points=\"46.0,153.6 84.5,80.9 123.0,65.3 161.5,70.2 200.1,60.5 238.6,43.0 277.1,54.7 315.6,147.8\" fill=\"none\" class=\"nvs\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"46.0\" cy=\"153.6\" r=\"4.4\" class=\"bg\"/><circle cx=\"46.0\" cy=\"153.6\" r=\"3.2\" class=\"nvf\"/><circle cx=\"84.5\" cy=\"80.9\" r=\"4.4\" class=\"bg\"/><circle cx=\"84.5\" cy=\"80.9\" r=\"3.2\" class=\"nvf\"/><circle cx=\"123.0\" cy=\"65.3\" r=\"4.4\" class=\"bg\"/><circle cx=\"123.0\" cy=\"65.3\" r=\"3.2\" class=\"nvf\"/><circle cx=\"161.5\" cy=\"70.2\" r=\"4.4\" class=\"bg\"/><circle cx=\"161.5\" cy=\"70.2\" r=\"3.2\" class=\"nvf\"/><circle cx=\"200.1\" cy=\"60.5\" r=\"4.4\" class=\"bg\"/><circle cx=\"200.1\" cy=\"60.5\" r=\"3.2\" class=\"nvf\"/><circle cx=\"238.6\" cy=\"43.0\" r=\"4.4\" class=\"bg\"/><circle cx=\"238.6\" cy=\"43.0\" r=\"3.2\" class=\"nvf\"/><circle cx=\"277.1\" cy=\"54.7\" r=\"4.4\" class=\"bg\"/><circle cx=\"277.1\" cy=\"54.7\" r=\"3.2\" class=\"nvf\"/><circle cx=\"315.6\" cy=\"147.8\" r=\"4.4\" class=\"bg\"/><circle cx=\"315.6\" cy=\"147.8\" r=\"3.2\" class=\"nvf\"/><text x=\"323.6\" y=\"160.3\" font-size=\"10.5\" font-weight=\"800\" class=\"nvf\">長距離<\/text><\/svg><p>短距離は1600mまで、中距離は<span style=\"white-space:nowrap\">1700〜2300m<\/span>、長距離は<span style=\"white-space:nowrap\">2400〜2600m<\/span>です。どの距離でも、500kgくらいまでは重い馬ほど3着内によく来ています。長距離でも、<span style=\"white-space:nowrap\">500〜519kg<\/span>の馬は100頭中26.8頭が3着内で、<span style=\"white-space:nowrap\">440〜459kg<\/span>の24.5頭より多いです。540kg以上だけは16.0頭と少なくなります。<\/p><p>数だけ見れば、大型馬は長距離でもよく来ています。ただ、ここには落とし穴があります。大きな馬には強い馬が多く、強い馬は人気にもなります。よく来るのは「大きいから」ではなく「強いから」かもしれません。<\/p><h4>人気と比べ直す<\/h4><p>そこで、人気と比べます。同じくらいの単勝オッズの馬が過去に3着内に来た割合から、「人気から考えると100頭中何頭来るはずか」を出し、実際に来た頭数と並べます。実際のほうが多ければ人気以上に走った（馬券ではお買い得）、少なければ人気ほど走らなかった（買われすぎ）ということです。<\/p><div class=\"epf\"><b>図2　500kg以上・距離別<\/b><small>100頭あたり、人気より何頭多く来たか<\/small><\/div><svg class=\"epc\" viewBox=\"0 0 360 236\" role=\"img\"><line x1=\"30\" y1=\"194.0\" x2=\"354\" y2=\"194.0\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"24\" y=\"197.5\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">-8<\/text><line x1=\"30\" y1=\"164.3\" x2=\"354\" y2=\"164.3\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"24\" y=\"167.8\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">-6<\/text><line x1=\"30\" y1=\"134.7\" x2=\"354\" y2=\"134.7\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"24\" y=\"138.2\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">-4<\/text><line x1=\"30\" y1=\"105.0\" x2=\"354\" y2=\"105.0\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"24\" y=\"108.5\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">-2<\/text><line x1=\"30\" y1=\"75.3\" x2=\"354\" y2=\"75.3\" class=\"zero\" stroke-width=\"1.2\"/><text x=\"24\" y=\"78.8\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">0<\/text><line x1=\"30\" y1=\"45.7\" x2=\"354\" y2=\"45.7\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"24\" y=\"49.2\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">+2<\/text><line x1=\"30\" y1=\"16.0\" x2=\"354\" y2=\"16.0\" class=\"grid\" stroke-width=\"0.8\"/><text x=\"24\" y=\"19.5\" text-anchor=\"end\" font-size=\"10\" class=\"n mu\">+4<\/text><rect x=\"37.0\" y=\"75.3\" width=\"26.5\" height=\"10.4\" rx=\"3\" class=\"nvf\"/><line x1=\"50.2\" y1=\"75.3\" x2=\"50.2\" y2=\"96.1\" style=\"stroke:#8a8a86\" stroke-width=\"1.3\"/><line x1=\"46.2\" y1=\"96.1\" x2=\"54.2\" y2
