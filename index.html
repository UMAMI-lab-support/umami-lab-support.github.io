:root{--trk-bg:#ffffff;--trk-in:#f3f8ef;--trk-turf:#dcebd4;--trk-dirt:#e8d9c4;--trk-tree:#cfe4c4;}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg2)}

a{color:inherit}
svg.ic{width:100%;height:100%;fill:none;stroke:#111;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 90px;min-height:100vh}
/* header */
.hd{display:flex;align-items:center;justify-content:space-between;min-height:40px}

.hd .wm>div{text-align:center}
.hd .wm .kana{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:700;letter-spacing:.06em;font-size:24px}
.hd .wm small.en{font-family:'Outfit',sans-serif;letter-spacing:.3em;font-weight:700}
.hd .dt{font-family:'DM Mono',monospace;font-size:11px;color:var(--mute);text-align:right;line-height:1.4}
.hd .dt b{display:block;color:var(--ink);font-size:13px;font-weight:400}
.hd .bk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px 6px 6px;border:1.5px solid var(--ink);border-radius:999px;background:#fff}

section{display:none}section.on{display:block}

/* segmented */
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.seg button{flex:1;padding:8px 0;font-size:12.5px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.seg.sm button{padding:6px 0;font-size:11.5px}
.seg.ten button{font-size:11px;padding:7px 0}
.seg.dsel{margin:10px 0 0}.seg.dsel button{font-size:12.5px;padding:9px 0}
.tkt.four{grid-template-columns:repeat(4,1fr)}
.row2{display:flex;gap:8px;align-items:center;margin-top:6px}.row2 input{margin-top:0;flex:1;min-width:0}.row2 .lnk-s{margin-left:0;white-space:nowrap;padding:8px 10px}.fl{display:block;font-family:'DM Mono';font-size:9.5px;color:var(--mute);letter-spacing:.06em;margin-top:12px}
.fr{padding:8px 0 10px;border-bottom:1px solid #e3e3df}.fr:last-child{border-bottom:none}.fh{display:flex;justify-content:space-between;align-items:center;font-size:13px}.fh b{font-weight:700}.fh .mono{font-size:13px}.fr input[type=range]{width:100%;accent-color:#111;margin:6px 0 2px}.fd{font-size:10.5px;color:var(--mute);line-height:1.5}
input.kb{width:100%;height:42px;box-sizing:border-box;padding:0 10px;border:1.5px solid var(--ink);border-radius:10px;font-size:14px;font-weight:700;background:#fff;margin-top:8px}
.cl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.cl button{height:34px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;font-size:12px;font-weight:700;white-space:nowrap}.cl button.on{background:var(--ink);color:#fff}
.elv{display:block;width:100%;height:70px;margin-top:8px}
.kv4{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.kv4 div{border:1.5px solid var(--ink);border-radius:10px;padding:7px 8px}.kv4 label{font-family:'DM Mono';font-size:9px;color:var(--mute);display:block;letter-spacing:.06em}.kv4 b{font-size:14px;font-weight:700;white-space:nowrap}.kv4 b small{font-size:10px;color:var(--mute);font-weight:500;margin-left:3px}
/* baba strip */
.strip{margin-top:12px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.strip .ln{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1.5px solid #e6e6e2;width:100%;text-align:left}
.strip .ln:last-of-type{border-bottom:none}
.strip .ln i{width:20px;height:20px;display:block;flex:0 0 20px}
.strip .ln b{font-size:14px;font-weight:700;width:44px}
.strip .ln .v{font-size:11.5px;color:var(--mute);font-weight:500;flex:1}
.strip .ln .v em{font-style:normal;font-family:'DM Mono';color:var(--ink);font-weight:400}
.strip .ln .ar{width:12px;height:12px;display:block;transition:transform .15s}
.strip .ln.open .ar{transform:rotate(90deg)}
.strip .dt{display:none;padding:0 12px 12px;border-bottom:1.5px solid #e6e6e2}
.strip .dt.on{display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-top:10px}
.kv div{background:#fff;padding:8px 8px 6px}
.kv div.c{background:var(--gr,#efefeb)}
.kv div.t{background:var(--g)}
.kv div.d{background:var(--br)}
.kv label{display:block;font-size:9.5px;color:var(--mute);font-weight:500}
.kv b{font-family:'DM Mono';font-size:20px;font-weight:400}
.kv b small{font-size:10px;color:var(--mute);margin-left:2px}
.kv i{display:block;font-size:9px;color:var(--mute);font-style:normal;font-weight:500}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px}
.hw{overflow-x:auto;margin:0 -12px;padding:0 12px}
.hg{display:grid;gap:3px;min-width:600px}
.hg div{text-align:center;font-size:9px;color:var(--mute);padding:4px 0;border-top:1.5px solid #ddd;font-weight:500}
.hg div b{display:block;font-family:'DM Mono';font-size:10px;color:var(--ink);font-weight:400}
.hg div i{display:block;width:18px;height:18px;margin:2px auto}
.hg div span{display:block;font-family:'DM Mono';font-size:10px;color:var(--ink);font-weight:400}
.hg div span.pr{font-size:9px;color:var(--mute)}
.hg div.w-sun{background:#fbeedd;border-radius:6px;border-top-color:#f0ddc4}
.hg div.w-cloud{background:#efefed;border-radius:6px;border-top-color:#e2e2df}
.hg div.w-snow{background:#eef3f7;border-radius:6px;border-top-color:#dbe5ed}
.hg div.w-rain,.hg div.rain{background:var(--b);border-radius:6px;border-top-color:#cfe0ee}
.wk div{text-align:center;font-size:9px;color:var(--mute);padding:4px 0;border-top:1.5px solid #ddd}
.wk div b{display:block;font-family:'DM Mono';font-size:12px;color:var(--ink);font-weight:400}
.wk div i{display:block;width:18px;height:18px;margin:2px auto}
.wk div.w-sun{background:#fbeedd;border-radius:6px;border-top-color:#f0ddc4}
.wk div.w-cloud{background:#efefed;border-radius:6px;border-top-color:#e2e2df}
.wk div.w-snow{background:#eef3f7;border-radius:6px;border-top-color:#dbe5ed}
.wk div.w-rain,.wk div.rain{background:var(--b);border-radius:6px;border-top-color:#cfe0ee}
.wk div i.sw{width:13px;height:13px;margin:1px auto 0;opacity:.6}
.note{font-size:11px;color:var(--mute);line-height:1.7;margin-top:8px}
.tico{margin-top:10px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.tico svg{display:block}
.tico .wl{font-size:11px;font-weight:500;padding:8px 10px;border-top:1.5px solid var(--ink);background:#fafaf7}
.tico .wl b{margin:0 2px}
.note li{margin-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11px;font-weight:500;padding:5px 10px;border:1.5px solid var(--ink);border-radius:999px;background:#fff}
.chip b{font-family:'DM Mono';font-weight:400;margin-left:4px}
.chip.y{background:var(--y)}.chip.g{background:var(--g)}.chip.b{background:var(--b)}
/* race grid */
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;margin-top:10px}
.rb{background:#fff;padding:8px 7px 7px;text-align:left;min-height:62px;position:relative}
.rb .rn{font-family:'DM Mono';font-size:15px;font-weight:400;line-height:1}
.rb .rn i{font-style:normal;font-size:8.5px;color:var(--soft);margin-left:3px}
.rb .nm{font-size:9.5px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.rb .cd{font-family:'DM Mono';font-size:8.5px;margin-top:2px;color:var(--mute)}
.rb.g{background:var(--y)}
.rb.next{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--g)}
.rb .tag{position:absolute;right:5px;top:5px;font-family:'DM Mono';font-size:7.5px;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:0 4px}
.rb.dis{background:#f1f1ee;color:#b5b5b0;cursor:default}
.rb.dis .rn,.rb.dis .nm,.rb.dis .cd,.rb.dis .rn i{color:#b5b5b0}
.rb .done{position:absolute;right:5px;top:5px;width:12px;height:12px}
/* race page */
.rh{margin-top:10px;text-align:center}
.rh .no{font-family:'DM Mono';font-size:10px;letter-spacing:.2em;color:var(--mute)}
.rh b{display:block;font-size:21px;font-weight:700;margin-top:2px}
.rh span{display:block;font-family:'DM Mono';font-size:10.5px;color:var(--mute);margin-top:2px}
.steps{position:sticky;top:0;z-index:20;background:#fff;padding:10px 0 8px;margin-top:8px}
.rh{position:relative}
.rnav{position:absolute;top:calc(50% - 4px);transform:translateY(-50%);width:34px;height:34px;
  border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.rnav.p{left:0}.rnav.n{right:0}
.rnav:disabled{opacity:.22}
.steps .stk .rnav{position:static;transform:none;width:24px;height:24px;font-size:12px}
.steps .stk span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.steps .stk{display:none;align-items:center;gap:6px;padding:0 2px 7px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .stk .no{font-family:'DM Mono';font-size:10.5px;color:var(--mute);font-weight:400;flex:none}
.steps .stk .gd{font-family:'DM Mono';font-size:10px;color:var(--mute);font-weight:400;flex:none}
.steps.on .stk{display:flex}
.steps .in{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.steps button{flex:1;padding:8px 0;font-size:11.5px;font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:4px}
.steps button i{font-style:normal;font-family:'DM Mono';font-size:10px}
.steps button.on{background:var(--ink);color:#fff}
.steps button .lk{width:10px;height:10px;display:block}
.steps button.on .lk svg{stroke:#fff}
.sec{margin-top:18px;scroll-margin-top:64px}
.sec .sh{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.sec .sh i{font-family:'DM Mono';font-size:11px;font-weight:400;font-style:normal}
.sec .sh b{font-size:15px;font-weight:700}
.sec .sh span{font-size:10.5px;color:var(--mute);margin-left:auto;font-weight:500}
.bub{position:relative;border:1.5px solid var(--ink);border-radius:14px;background:#fff;padding:14px 12px 12px;margin-top:14px}
.bub.tail:after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:#fff;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.cat{display:flex;align-items:flex-start;justify-content:space-between}
.cat .it{flex:1;text-align:center;min-width:0}
.cat .it i{display:block;width:40px;height:40px;margin:0 auto 6px}
.cat .it b{display:block;font-family:'DM Mono';font-size:9.5px;font-weight:400;letter-spacing:.04em}
.cat .it small{display:block;font-size:9.5px;color:var(--mute);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .plus{font-family:'DM Mono';font-size:16px;font-weight:400;padding-top:12px}
.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
.t th{font-family:'DM Mono';font-size:9.5px;color:var(--mute);font-weight:400;text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap;letter-spacing:.06em}
.t td{padding:7px 6px;border-bottom:1px solid #e3e3df;text-align:right;white-space:nowrap}
.t th.l,.t td.l{text-align:left}
.t td.nm{font-weight:700;white-space:nowrap;line-height:1.15}
.t td small{color:var(--soft);font-family:'DM Mono';font-size:9.5px;margin-left:4px;font-weight:400}
.t td.nm small{display:block;margin:1px 0 0}
.t tr.hi td{background:var(--g)}
.t.cmp td.l{white-space:nowrap;line-height:1.35;font-size:12px}
.t.cmp td.l small{display:block;font-size:10px;font-weight:400;color:var(--soft);line-height:1.3;margin-top:1px}.t.cmp td:not(.l),.t.cmp th:not(.l){width:52px;text-align:center;white-space:nowrap}
.t tr.gb td{background:var(--g)}.t tr.gs td{background:var(--p)}.t td.nm1{white-space:nowrap;font-weight:800}
.nm2{font-weight:800;margin-left:4px}.gapt td,.gapt th{white-space:nowrap}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
.cap{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-family:'DM Mono';font-weight:400;font-size:11.5px;box-shadow:inset 0 0 0 1.5px #111}
.kb{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;border:1.5px solid var(--ink)}
.kb.nige{background:var(--ink);color:#fff}.kb.senko{background:var(--y)}.kb.sashi{background:var(--b)}.kb.oikomi{background:#fff}
.lock{border:1.5px dashed var(--ink);border-radius:14px;padding:18px 14px;text-align:center;margin-top:12px;background:#fff}
.lock i{width:32px;height:32px;display:block;margin:0 auto 8px}
.lock p{font-size:12px;color:var(--mute);margin-bottom:12px;font-weight:500}
.lock .pw{display:flex;gap:6px;max-width:320px;margin:0 auto}
.lock input{flex:1;padding:10px;border:1.5px solid var(--ink);border-radius:999px;font-size:15px;text-align:center;letter-spacing:.14em;font-family:'DM Mono';min-width:0}
.lock button{padding:10px 16px;background:var(--ink);color:#fff;border-radius:999px;font-weight:700;font-size:13px}
.lock .er{color:#c0392b;font-size:11.5px;margin-top:8px;display:none}
.lock .n{font-size:10px;color:var(--soft);margin-top:10px}

html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}  /* 勝手な文字の拡大を止める */

.lead{font-size:11.5px;color:var(--mute);line-height:1.85;margin-top:9px}

.hito div{padding-left:1em;text-index:-1em;position:relative}.hito div:before{content:"・";position:absolute;left:0}
.fsvg svg{display:block}
.pm .pmb{position:relative;height:22px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:linear-gradient(90deg,var(--g) 0 32%,var(--y) 32% 55%,var(--p) 55% 100%);display:flex}
.pm .pmb span{flex:1;text-align:center;font-family:'DM Mono';font-size:10px;line-height:20px;color:var(--mute)}
.pm .pmb i{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--ink);transform:translateX(-50%)}
.pm .pml{display:flex;justify-content:space-between;font-size:11px;font-weight:500;margin-top:6px;gap:8px;flex-wrap:wrap}
.t tr[data-h]{cursor:pointer}
.hcard{display:none}.hcard.on{display:table-row}
.hcard td{padding:0 0 8px;text-align:left;white-space:normal}
.hc{border:1px solid var(--line);border-radius:4px;padding:10px;background:#f7f7f7}
.hcl{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.hcl b{font-family:'DM Mono';font-size:10px;letter-spacing:.14em;color:var(--mute);font-weight:400}.hcl span{font-size:14px;font-weight:700}
.hcg{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.hcg div{background:#fff;padding:7px 8px 6px}.hcg label{display:block;font-size:9.5px;color:var(--mute);font-weight:500}.hcg b{display:block;font-size:13px;font-weight:700}.hcg b.mono{font-weight:400}.hcg i{display:block;font-style:normal;font-size:9.5px;color:var(--soft);font-weight:500}
.hcg.ans{margin-top:0;background:transparent;border:none;gap:6px;border-radius:0}
.hcg>div.w2{grid-column:1/-1}   /* 欄が奇数のときに横いっぱいにする欄 */
.hcg.ans div{border:1.5px solid var(--ink);border-radius:8px}
.gap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{border:1.5px solid var(--ink);border-radius:10px;padding:8px}.gc.g{background:var(--g)}.gc.p{background:var(--p)}
.gc label{display:block;font-size:10px;font-weight:700;margin-bottom:6px}.gc div{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:4px;flex-wrap:wrap}.gc div b{font-weight:700}.gc div .mono{font-size:9.5px;color:var(--mute);width:100%;padding-left:28px}
.tk{display:grid;gap:8px}.tk>div{border:1.5px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff}
.tk label{display:block;font-size:10.5px;font-weight:700;margin-bottom:6px}.tks{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.tks .dash{font-family:'DM Mono';color:var(--mute);margin:0 1px}.tk i{display:block;font-style:normal;font-size:10px;color:var(--mute);font-weight:500;margin-top:6px}

/* ===== 前走の出来事（JRA発表「競走中の出来事等」） ===== */
.ib{display:inline-block;font-family:'Noto Sans JP',sans-serif;font-size:9px;font-weight:700;letter-spacing:.04em;line-height:1;padding:3px 4px 2px;border:1px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);white-space:nowrap;vertical-align:1px}
.t td.nm small .ib{margin-left:6px}
.hinc{margin-top:10px;white-space:normal}
.hinc>label{display:block;font-size:9.5px;color:var(--mute);font-weight:500;letter-spacing:.06em;margin-bottom:2px}
.hinc>label small{margin-left:6px;color:var(--soft);font-size:9px}
.il{padding:7px 0;border-top:1px solid var(--line)}
.il .ih{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.il .ih i{font-style:normal;font-size:10.5px;font-weight:700;flex:none;min-width:2.9em}
.il .ih b{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:0}
.il .ih em{font-style:normal;margin-left:auto;font-family:'DM Mono';font-size:10.5px;color:var(--mute);flex:none}
.il p{font-size:11px;line-height:1.7;margin-top:4px;letter-spacing:.04em}
.il .ie{display:flex;gap:7px;align-items:baseline}.il .ie .ib{flex:none}
.irc .ir{padding:9px 0;border-bottom:1px solid var(--line)}
.irc .irh{display:flex;align-items:center;gap:8px}
.irc .irh b{font-size:13px;font-weight:700}
.irc .irh .ib{margin-left:auto}
.irc p{font-size:11.5px;line-height:1.8;margin-top:4px;letter-spacing:.04em}
.iw{margin-top:4px}
.iwr{margin-top:16px}
.iw.iwp{margin-top:10px}
.iwh{display:flex;align-items:center;gap:6px;width:100%;text-align:left;font-size:12.5px;font-weight:700;padding:0 0 6px;border-bottom:1.5px solid var(--ink);background:none}
.iwh i{width:12px;height:12px;margin-left:auto;flex:none}
.iwl{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.iwl .cap{flex:none;margin-top:1px}
.iwb{min-width:0;flex:1}
.iwn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:2px}   /* 名前は切らない。入りきらないときは人気を次の行へ */
.iwn b{font-size:13px;font-weight:700;white-space:nowrap}
.iwn em{font-style:normal;margin-left:auto;font-family:'DM Mono';font-size:10.5px;color:var(--mute);flex:none}
.iwb p{font-size:11px;line-height:1.75;color:var(--mute);margin-top:3px;letter-spacing:.04em}
.iwb .ie{display:flex;gap:7px;align-items:baseline;margin-top:5px}.iwb .ie .ib{flex:none}
.iwb .ig{color:var(--ink);font-weight:500;margin-top:8px}.iwb .iwn+.ig{margin-top:3px}
.ib.gv{border-style:dashed;border-color:var(--soft);color:var(--mute);font-weight:500}
.ie.gv>span:last-child,.irc p.gv{color:var(--mute)}
/* 馬カードを見えている幅に収める（出走表が画面より広いとき、カードの右が切れていたのを直す） */
.hcard td>.hc{position:sticky;left:0;box-sizing:border-box;max-width:calc(min(100vw,520px) - 80px)}

/* ===== 想定ラップ ===== */
.lapg{margin-top:10px}
.lapg svg{display:block;width:100%;height:auto}
.lapg svg text{letter-spacing:0;font-family:'DM Mono',monospace}   /* サイト全体の字間が効くと目盛りの数字が欠ける */
.lapleg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:10.5px;color:var(--mute);letter-spacing:.04em}
.lapleg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lapleg svg{width:26px;height:10px;flex:none}
.lapt{margin-top:6px}
.lapt p{display:flex;gap:8px;align-items:center;font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:0;line-height:1.6;padding:4px 0;border-bottom:1px solid var(--line)}
.lapt p>span{flex:none;min-width:30px;font-family:inherit;font-size:10px;color:var(--mute);letter-spacing:.04em}
.lapt p.h .cap{width:18px;height:18px;min-width:0;font-size:10px}   /* 丸は丸のまま（外側の span の幅を継がない）。行の上下の中心に置く */
.lapc{display:flex;flex-wrap:wrap;gap:10px 4px;margin-top:14px}
.lapc button{padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:46px;background:none}   /* 押しやすい大きさ（丸32px・幅46px） */
.lapc button .cap{width:32px;height:32px;font-size:15px}
.lapc button small{font-size:10px;line-height:1;letter-spacing:0;color:var(--mute);white-space:nowrap}
.lapc button.on small{color:var(--ink);font-weight:700}
.lapc button.on .cap{box-shadow:inset 0 0 0 1.5px #111,0 0 0 2px #fff,0 0 0 4px #111}
.lapd{font-size:11.5px;line-height:1.8;margin-top:10px;letter-spacing:.04em;white-space:normal}
.lapd b{font-weight:700}
.lapd .ok{color:#1f7a4d;font-weight:700;white-space:nowrap}.lapd .ng{color:#b0413e;font-weight:700;white-space:nowrap}

body{font-weight:400}

    for(let i=0;i<=N2;i++){ const ss=q0+(q1-q0)*i/N2, p=g.rpos(ss), nn=normalAtR(g,ss), y=hS; const a=[p[0]+nn[0]*(railOff+railW/2),y,p[1]+nn[1]*(railOff+railW/2)], b=[p[0]+nn[0]*(railOff-railW/2),y,p[1]+nn[1]*(railOff-railW/2)]; top.push(...a,...b); e1.push(new THREE.Vector3(a[0],a[1]+.3,a[2])); e2.push(new THREE.Vector3(b[0],b[1]+.3,b[2])); }
    for(let i=0;i<N2;i++){ const a=i*2,b=a+2; idx.push(a,b+1,a+1,a,b,b+1); } const cg=new THREE.BufferGeometry(); cg.setAttribute('position',new THREE.Float32BufferAttribute(top,3)); cg.setIndex(idx);
    grp.add(new THREE.Mesh(cg,new THREE.MeshBasicMaterial({color:T.runC,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2})));
    [e1,e2].forEach(e=>grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(e),new THREE.LineBasicMaterial({color:INK})))); grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([e1[0],e2[0]]),new THREE.LineBasicMaterial({color:INK}))); }
  { const p=g.rpos(s0), nn=normalAtR(g,s0), W2=railW+4; const a=new THREE.Vector3(p[0]+nn[0]*(railOff+W2/2),hS+.6,p[1]+nn[1]*(railOff+W2/2)), b=new THREE.Vector3(p[0]+nn[0]*(railOff-W2/2),hS+.6,p[1]+nn[1]*(railOff-W2/2)); grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:INK}))); }
  const sl=labelSprite('S','#111','#fff',16,'#111'); const sp=g.rpos(s0); sl.position.set(sp[0],hS+18,sp[1]); grp.add(sl);
  T.horses=r.runners.map(h=>{const q=horseNode(h); grp.add(q); return q;}); T.railOff=railOff; T.railW=railW; T.hR=hR; T.hRace=ss=>g.relev(ss)*EX*(dirt?0.9:1)-(dirt?1.5:0);
  T.scene.add(grp); placeHorses(); }
function horsePos(i,gapx){ const g=S.geo,h=S.r.runners[i]; let s,lane; if(!S.tracks){ const sp=g.chute?Math.min(3.2*gapx,10):3.2*gapx; s=g.s0-(h.uno-1)*sp; lane=((h.waku||4)-1)/7; } else { s=g.s0+Math.max(0,S.tracks.lead(S.t)-S.tracks.gap(i,S.t)*gapx); lane=S.tracks.lane(i,S.t); } return {s,lane}; }
function placeHorses(){ if(!T||!S||!T.horses.length) return; const g=S.geo,gapx=T.follow?2.6:5.5;
  T.horses.forEach((q,i)=>{ const {s,lane}=horsePos(i,gapx), p=g.rpos(s),n=normalAtR(g,s),off=T.railOff+(lane-0.5)*T.railW*0.9; q.position.set(p[0]+n[0]*off,T.hRace(s),p[1]+n[1]*off); }); drawFormation(); }
function camDir(){ return new THREE.Vector3(Math.sin(T.pol)*Math.sin(T.az),Math.cos(T.pol),Math.sin(T.pol)*Math.cos(T.az)); }
function placeCam(){ const cam=T.camera; cam.position.copy(T.target).add(camDir().multiplyScalar(1500)); cam.lookAt(T.target); cam.zoom=T.zoom; cam.updateProjectionMatrix(); }
function fitCamera(){ if(!T||!S) return; const g=S.geo,cam=T.camera; T.target.set(0,0,8); T.follow=false; T.zoom=1; placeCam();
  const X=(g.bx!=null?g.bx:g.L/2+g.rad)+g.W+20, Z=(g.bz!=null?g.bz:g.rad)+g.W+40, Y=60; let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9; [[-X,-Z],[X,-Z],[-X,Z],[X,Z]].forEach(([x,z])=>[0,Y].forEach(y=>{ const v=new THREE.Vector3(x,y,z).project(cam); mnx=Math.min(mnx,v.x);mxx=Math.max(mxx,v.x);mny=Math.min(mny,v.y);mxy=Math.max(mxy,v.y); }));
  T.zoom=Math.min(2/(mxx-mnx),2/(mxy-mny))*0.97; T.fitZoom=T.zoom; placeCam(); }
function followCam(){ if(!S.tracks||!S.order) return; const g=S.geo,i=S.order[0],s=g.s0+S.tracks.dist(i,S.t),p=g.rpos(s); T.target.lerp(new THREE.Vector3(p[0],T.hRace(s),p[1]),0.12); T.zoom+= (T.fitZoom*2.6-T.zoom)*0.1; placeCam(); }
function loop3D(){ if(!T) return; T.anim=requestAnimationFrame(loop3D); if(!S||!T.cv.isConnected||!(document.getElementById('s-race').classList.contains('on')||document.getElementById('s-course').classList.contains('on'))) return; placeHorses(); if(T.follow&&S.running) followCam();
  const k=T.fitZoom/T.zoom*(T.follow?1.7:1); T.horses.forEach(q=>q.userData.sp.scale.set(24*k,24*k,1)); T.labels.forEach(sp=>{ const b=sp.userData.base; if(sp.material.map&&sp.scale.x!==sp.scale.y*2) sp.scale.set(b*k,b*k,1); else sp.scale.set(b*2*k,b*k,1); }); windStep(); T.renderer.render(T.scene,T.camera); }
function bindOrbit(){ const cv=T.cv; let lx=0,ly=0,drag=false,pd=0,two=false;
  cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'){drag=true;lx=e.clientX;ly=e.clientY;}});
  window.addEventListener('pointermove',e=>{if(!drag||!T)return;T.follow=false;T.az-=(e.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;placeCam();});
  window.addEventListener('pointerup',()=>drag=false);
  cv.addEventListener('wheel',e=>{e.preventDefault();T.zoom*=e.deltaY>0?0.9:1.1;T.follow=false;placeCam();},{passive:false});
  const td=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){two=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){two=true;pd=td(e.touches);}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();T.follow=false;if(e.touches.length===2){const d=td(e.touches);if(pd)T.zoom*=d/pd;pd=d;placeCam();}else if(e.touches.length===1&&!two){const t=e.touches[0];T.az-=(t.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(t.clientY-ly)*0.005));lx=t.clientX;ly=t.clientY;placeCam();}},{passive:false});
  cv.addEventListener('touchend',e=>{if(e.touches.length===0){two=false;pd=0;}}); }
/* 隊列ボード(線画): 横=先頭からの差(右が先頭)、縦=内(下)〜外(上) */
function drawFormation(){ const cv=document.getElementById('fm'); if(!cv||!S) return; const dpr=Math.min(2,window.devicePixelRatio||1), w=cv.parentElement.clientWidth||500, h=100; if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=h*dpr;cv.style.height=h+'px';}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); const hs=S.r.runners, padL=34,padR=14,top=10,bot=h-16;
  x.strokeStyle='#111'; x.lineWidth=1.5; x.strokeRect(padL+.75,top+.75,w-padL-padR-1.5,bot-top-1.5); x.setLineDash([3,4]); x.strokeStyle='#999'; x.lineWidth=1; x.beginPath(); x.moveTo(padL,(top+bot)/2); x.lineTo(w-padR,(top+bot)/2); x.stroke(); x.setLineDash([]);
  x.fillStyle='#666'; x.font='500 9px "DM Mono",monospace'; x.textAlign='right'; x.fillText('OUT',padL-6,top+10); x.fillText('IN',padL-6,bot-2);
  const pos=hs.map((h,i)=>{ const {s,lane}=horsePos(i,1); return {h,i,s,lane}; }); const smax=Math.max(...pos.map(p=>p.s)), span=Math.max(60,smax-Math.min(...pos.map(p=>p.s)));
  pos.sort((a,b)=>a.s-b.s).forEach(p=>{ const px=padL+12+(w-padL-padR-26)*(1-(smax-p.s)/span), py=bot-9-(bot-top-18)*p.lane; x.beginPath(); x.arc(px,py,8,0,Math.PI*2); x.fillStyle=WBG[p.h.waku]||'#999'; x.fill(); x.lineWidth=1.5; x.strokeStyle='#111'; x.stroke(); x.fillStyle=WFG[p.h.waku]||'#fff'; x.font='700 9px "DM Mono",monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(p.h.uno,px,py+.5); x.textBaseline='alphabetic'; });
  x.fillStyle='#111'; x.font='500 9px "DM Mono",monospace'; x.textAlign='left'; x.fillText(S.tracks?`GAP ${Math.round(span)}m`:'GATE',padL,bot+12); x.textAlign='right'; x.fillText('LEAD →',w-padR,bot+12); }
function draw(){ placeHorses(); }
/* ===== 3D END ===== */
</script>
