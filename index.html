function styleOf(r){ const hs=r.runners, st={}; const fmv=hs.filter(h=>h.fm!=null);

  hs.forEach(h=>{ if(!st[h.uno]){ const p=h.h1c1||h.prevpos; st[h.uno]= p==null?'差し': p<=1?'逃げ': p<=4?'先行': p<=Math.max(6,hs.length*0.6)?'差し':'追込'; }}); return st; }

function strengths(r){ const hs=r.runners, n=hs.length; let p, src;

  else if(hs.some(h=>h.odds)){ p=hs.map(h=>h.odds?Math.pow(1/h.odds,0.93):null); src='市場評価'; }

    p=hs.map((h,i)=>{ let s=0; s+= ra[i]!=null?(1-ra[i])*1.1:0.4; s+= rt[i]!=null?(1-rt[i])*0.5:0.2; if(h.prevpos!=null) s+=Math.max(0,1-(h.prevpos-1)/8)*0.5; return Math.exp(s*1.6); }); src='暫定（ラップ・前走位置）'; }

  x.fillStyle=bg; x.strokeStyle=border||'#111'; x.lineWidth=5; x.beginPath(); if(x.roundRect) x.roundRect((256-tw)/2,22,tw,84,42); else x.rect((256-tw)/2,22,tw,84); x.fill(); x.stroke(); x.fillStyle=fg; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,128,66);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true})); sp.scale.set(scale*2,scale,1); sp.renderOrder=5; sp.userData.base=scale; if(T) T.labels.push(sp); return sp; }
function lineSprite(draw,scale){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); x.lineWidth=5; x.strokeStyle='#111'; x.lineCap='round'; x.lineJoin='round'; x.fillStyle='#fff'; draw(x); const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false})); sp.scale.set(scale,scale,1); sp.userData.base=scale; sp.renderOrder=4; if(T) T.labels.push(sp); return sp; }
const drawTree=x=>{ x.beginPath(); x.moveTo(64,118); x.lineTo(64,80); x.stroke(); x.beginPath(); x.arc(64,58,34,0,Math.PI*2); x.fill(); x.stroke(); x.beginPath(); x.arc(46,66,16,0,Math.PI*2); x.fill(); x.stroke(); };
const drawFlag=x=>{ x.beginPath(); x.moveTo(50,120); x.lineTo(50,14); x.stroke(); x.beginPath(); x.moveTo(50,18); x.lineTo(98,30); x.lineTo(50,44); x.closePath(); x.fill(); x.stroke(); };
function horseNode(h){ const grp=new THREE.Group();
  const puck=new THREE.Mesh(new THREE.CylinderGeometry(4,4,2,18),new THREE.MeshBasicMaterial({color:WBG[h.waku]||'#999'})); puck.position.y=1; grp.add(puck);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(puck.geometry,60),new THREE.LineBasicMaterial({color:INK})); e.position.y=1; grp.add(e);
  const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); x.beginPath(); x.arc(64,64,52,0,Math.PI*2); x.fillStyle=WBG[h.waku]||'#999'; x.fill(); x.lineWidth=7; x.strokeStyle='#111'; x.stroke();
  x.fillStyle=WFG[h.waku]||'#fff'; x.font='700 66px "DM Mono","Zen Kaku Gothic New",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(h.uno,64,68);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false})); sp.renderOrder=10; sp.position.y=9; grp.add(sp); grp.userData.sp=sp; return grp; }
function buildTrack3D(){ const g=S.geo, r=S.r, dirt=r.surface==='ダ'; const EX=18; g.EX=EX; const hT=s=>g.elev(s)*EX, hD=s=>g.elev(s)*EX*0.9-1.5;
  const grp=new THREE.Group(); T.group=grp; const W=g.W, dOff=-(W+12), DEP=9;
  grp.add(bandMesh(g,0,W,hT, dirt?0xf1f1ed:0xffffff, DEP));
  grp.add(bandMesh(g,dOff,W*0.85,hD, dirt?0xffffff:0xf1f1ed, DEP-3));
  [[W/2,hT,DEP],[-W/2,hT,DEP],[dOff+W*0.85/2,hD,DEP-3],[dOff-W*0.85/2,hD,DEP-3]].forEach(([o,f,d])=>{ grp.add(outline(g,o,f,0.3,INK,false)); grp.add(outline(g,o,s=>f(s)-d,0,INK,false)); });
  // 内馬場(白) + 木
  const N=140, ipos=[0,-1.2,0], iidx=[]; for(let i=0;i<N;i++){const s=i/N*g.C,p=g.pos(s),n=normalAt(g,s),o=dOff-W*0.85/2-2; ipos.push(p[0]+n[0]*o,-1.2,p[1]+n[1]*o);} for(let i=1;i<=N;i++){iidx.push(0,i%N+1,i);}
  const ig=new THREE.BufferGeometry(); ig.setAttribute('position',new THREE.Float32BufferAttribute(ipos,3)); ig.setIndex(iidx); grp.add(new THREE.Mesh(ig,new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})));
  const railOff=dirt?dOff:0, railW=dirt?W*0.85:W, hR=dirt?hD:hT; grp.add(outline(g,railOff,hR,0.4,0x777777,true));
  // ハロン棒 / ゴール / 頂上 / スタート
  for(let s=200;s<g.C-50;s+=200){ grp.add(crossLine(g,s,railW,railOff,hR(s)+.5,0xbbbbbb)); }
  grp.add(crossLine(g,0,railW+6,railOff,hR(0)+.6,INK)); const gp=g.pos(0),gn=normalAt(g,0);
  const gl=labelSprite('G','#fff','#111',16,'#111'); gl.position.set(gp[0]+gn[0]*(railOff+railW/2+6),hR(0)+18,gp[1]+gn[1]*(railOff+railW/2+6)); grp.add(gl);
  const s0=((-r.dist%g.C)+g.C)%g.C; g.s0=s0; grp.add(crossLine(g,s0,railW+4,railOff,hR(s0)+.6,INK)); const sl=labelSprite('S','#111','#fff',16,'#111'); const sp=g.pos(s0); sl.position.set(sp[0],hR(s0)+18,sp[1]); grp.add(sl);
  T.horses=r.runners.map(h=>{const q=horseNode(h); grp.add(q); return q;}); T.railOff=railOff; T.railW=railW; T.hR=hR;
  T.scene.add(grp); placeHorses(); }
function horsePos(i,gapx){ const g=S.geo,h=S.r.runners[i]; let s,lane; if(!S.tracks){ s=g.s0-(h.uno-1)*3.2*gapx; lane=((h.waku||4)-1)/7; } else { s=g.s0+Math.max(0,S.tracks.lead(S.t)-S.tracks.gap(i,S.t)*gapx); lane=S.tracks.lane(i,S.t); } return {s,lane}; }
function placeHorses(){ if(!T||!S||!T.horses.length) return; const g=S.geo,gapx=T.follow?2.6:5.5;
  T.horses.forEach((q,i)=>{ const {s,lane}=horsePos(i,gapx), p=g.pos(s),n=normalAt(g,s),off=T.railOff+(lane-0.5)*T.railW*0.9; q.position.set(p[0]+n[0]*off,T.hR(s),p[1]+n[1]*off); }); drawFormation(); }
function camDir(){ return new THREE.Vector3(Math.sin(T.pol)*Math.sin(T.az),Math.cos(T.pol),Math.sin(T.pol)*Math.cos(T.az)); }
function placeCam(){ const cam=T.camera; cam.position.copy(T.target).add(camDir().multiplyScalar(1500)); cam.lookAt(T.target); cam.zoom=T.zoom; cam.updateProjectionMatrix(); }
function fitCamera(){ if(!T||!S) return; const g=S.geo,cam=T.camera; T.target.set(0,0,8); T.follow=false; T.zoom=1; placeCam();
  const X=g.L/2+g.rad+g.W+20, Z=g.rad+g.W+40, Y=60; let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9; [[-X,-Z],[X,-Z],[-X,Z],[X,Z]].forEach(([x,z])=>[0,Y].forEach(y=>{ const v=new THREE.Vector3(x,y,z).project(cam); mnx=Math.min(mnx,v.x);mxx=Math.max(mxx,v.x);mny=Math.min(mny,v.y);mxy=Math.max(mxy,v.y); }));
  T.zoom=Math.min(2/(mxx-mnx),2/(mxy-mny))*0.97; T.fitZoom=T.zoom; placeCam(); }
function followCam(){ if(!S.tracks||!S.order) return; const g=S.geo,i=S.order[0],s=g.s0+S.tracks.dist(i,S.t),p=g.pos(s); T.target.lerp(new THREE.Vector3(p[0],T.hR(s),p[1]),0.12); T.zoom+= (T.fitZoom*2.6-T.zoom)*0.1; placeCam(); }
function loop3D(){ if(!T) return; T.anim=requestAnimationFrame(loop3D); if(!S||!T.cv.isConnected||!(document.getElementById('s-race').classList.contains('on')||document.getElementById('s-course').classList.contains('on'))) return; placeHorses(); if(T.follow&&S.running) followCam();
  const k=T.fitZoom/T.zoom*(T.follow?1.7:1); T.horses.forEach(q=>q.userData.sp.scale.set(24*k,24*k,1)); T.labels.forEach(sp=>{ const b=sp.userData.base; if(sp.material.map&&sp.scale.x!==sp.scale.y*2) sp.scale.set(b*k,b*k,1); else sp.scale.set(b*2*k,b*k,1); }); T.renderer.render(T.scene,T.camera); }
function bindOrbit(){ const cv=T.cv; let lx=0,ly=0,drag=false,pd=0,two=false;
  cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'){drag=true;lx=e.clientX;ly=e.clientY;}});
  window.addEventListener('pointermove',e=>{if(!drag||!T)return;T.follow=false;T.az-=(e.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;placeCam();});
  window.addEventListener('pointerup',()=>drag=false);
  cv.addEventListener('wheel',e=>{e.preventDefault();T.zoom*=e.deltaY>0?0.9:1.1;T.follow=false;placeCam();},{passive:false});
  const td=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){two=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){two=true;pd=td(e.touches);}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();T.follow=false;if(e.touches.length===2){const d=td(e.touches);if(pd)T.zoom*=d/pd;pd=d;placeCam();}else if(e.touches.length===1&&!two){const t=e.touches[0];T.az-=(t.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(t.clientY-ly)*0.005));lx=t.clientX;ly=t.clientY;placeCam();}},{passive:false});
  cv.addEventListener('touchend',e=>{if(e.touches.length===0){two=false;pd=0;}}); }
/* 隊列ボード(線画): 横=先頭からの差(右が先頭)、縦=内(下)〜外(上) */
function drawFormation(){ const cv=document.getElementById('fm'); if(!cv||!S) return; const dpr=Math.min(2,window.devicePixelRatio||1), w=cv.parentElement.clientWidth||500, h=100; if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=h*dpr;cv.style.height=h+'px';}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); const hs=S.r.runners, padL=34,padR=14,top=10,bot=h-16;
  x.strokeStyle='#111'; x.lineWidth=1.5; x.strokeRect(padL+.75,top+.75,w-padL-padR-1.5,bot-top-1.5); x.setLineDash([3,4]); x.strokeStyle='#999'; x.lineWidth=1; x.beginPath(); x.moveTo(padL,(top+bot)/2); x.lineTo(w-padR,(top+bot)/2); x.stroke(); x.setLineDash([]);
  x.fillStyle='#666'; x.font='500 9px "DM Mono",monospace'; x.textAlign='right'; x.fillText('OUT',padL-6,top+10); x.fillText('IN',padL-6,bot-2);
  const pos=hs.map((h,i)=>{ const {s,lane}=horsePos(i,1); return {h,i,s,lane}; }); const smax=Math.max(...pos.map(p=>p.s)), span=Math.max(60,smax-Math.min(...pos.map(p=>p.s)));
  pos.sort((a,b)=>a.s-b.s).forEach(p=>{ const px=padL+12+(w-padL-padR-26)*(1-(smax-p.s)/span), py=bot-9-(bot-top-18)*p.lane; x.beginPath(); x.arc(px,py,8,0,Math.PI*2); x.fillStyle=WBG[p.h.waku]||'#999'; x.fill(); x.lineWidth=1.5; x.strokeStyle='#111'; x.stroke(); x.fillStyle=WFG[p.h.waku]||'#fff'; x.font='700 9px "DM Mono",monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(p.h.uno,px,py+.5); x.textBaseline='alphabetic'; });
  x.fillStyle='#111'; x.font='500 9px "DM Mono",monospace'; x.textAlign='left'; x.fillText(S.tracks?`GAP ${Math.round(span)}m`:'GATE',padL,bot+12); x.textAlign='right'; x.fillText('LEAD →',w-padR,bot+12); }
function draw(){ placeHorses(); }
/* ===== 3D END ===== */
</script>
