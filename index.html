function b64d(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function kekOf(pw){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(PAID.salt),iterations:PAID.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']); }

const LSK2='umami_pws';            /* この端末で覚えている合い言葉（いくつでも。前の形は LSK に1つだけ） */
const dec=(k,iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},k,b64d(ct));
async function openWith(pw){       /* その合い言葉で開ける日を全部開く。戻り: 開けた日（前から開いていた日も含む） */
  const k=await kekOf(pw), got=[];
  if(!PAID.days){                  /* 前の形（全部の日をまとめて1つ）にも対応 */
    try{ const p=JSON.parse(new TextDecoder().decode(await dec(k,PAID.iv,PAID.ct))); Object.keys(DAYS).forEach(d=>{ if(!OPEN[d]) OPEN[d]=p; got.push(d); }); }catch(e){}
    return got; }
  for(const [d,x] of Object.entries(PAID.days)){
    for(const w of (x.w||[])){
      try{ const raw=await dec(k,w.iv,w.k);
        if(!OPEN[d]){ const ck=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']); OPEN[d]=JSON.parse(new TextDecoder().decode(await dec(ck,x.iv,x.ct))); }
        got.push(d); break; }catch(e){} } }
  return got; }

function pwList(){ const l=ls.get(LSK2,null); if(Array.isArray(l)) return l; const o=ls.get(LSK,null); return (o&&typeof o==='object'&&o.pw)?[{pw:o.pw,d:o.d}]:[]; }

function applyPaid(paid){
  if(!paid) return;
  PAIDDATA=paid;
  Object.values(DAYS).forEach(day=>{        /* 全部の日のレースに当てる */
    (day.races||[]).forEach(r=>{
      const pr=paid.races[r.rid]; if(!pr) return;
      r.load_rate=pr.load_rate; r.nige=pr.nige; r.pace_z=pr.pace_z; r.pace_pf=pr.pace_pf;
      r.pace_cls=pr.pace_cls; r.pace_pos=pr.pace_pos; r.pace_p=pr.pace_p; r.pace_p1000=pr.pace_p1000; r.pace_seg=pr.pace_seg;
      if(pr.chiipaku) r.chiipaku=pr.chiipaku;

      if(pr.elap) r.elap=pr.elap;   /* 想定ラップ（会員向け） */
      const m={}; (pr.runners||[]).forEach(x=>m[x.uno]=x);

function loopFor(r){ /* そのレースで使う周回。出馬表の内外の表記（r.geo.io）があればそれ、無ければ距離から */
  const c=COURSE[r.place]||COURSE['06'], dirt=r.surface==='ダ', t=dirt?c.dirt:c.turf;
  const list=(SHAPE[r.place]||{})[dirt?'dirt':'turf'], io=(!dirt&&r.geo&&r.geo.io)||null;
  let v=list&&((io&&list.find(x=>x.io===io))||list.find(x=>x.dists&&x.dists.includes(+r.dist))||list.find(x=>!x.dists)||list[0]);
  if(!v) v={name:'',C:t.C,S:t.S,run:0,c12:OVAL,c34:OVAL};
  return v; }
function loopOf(v){ /* 周回の点列を作る。始点=ゴール。戻り値 {pts:[[x,y]...]（2m刻み）, ds, marks}

  const integ=(pcs,h0)=>{ let x=0,y=0,h=h0,len=0; pcs.forEach(p=>{ if(p[0]==='S'){ const l=p[1]; x+=Math.cos(h)*l; y+=Math.sin(h)*l; len+=l; } else { const R=p[1],a=p[2]*Math.PI/180,cx=x+Math.sin(h)*R,cy=y-Math.cos(h)*R,h2=h-a; x=cx-Math.sin(h2)*R; y=cy+Math.cos(h2)*R; h=h2; len+=R*a; } }); return {dx:x,dy:y,len,h}; };
  const a=integ(v.c12,0), h1=a.h, b=integ(v.c34,h1), Lh=v.S+v.run, cx=Math.cos(h1), sy=Math.sin(h1);
  const A=[[a.dx,b.dx,cx],[a.dy,b.dy,sy],[a.len,b.len,1]], R=[-Lh,0,v.C-Lh];
  const det=m=>m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  const D=det(A), col=i=>A.map((r,k)=>r.map((x,j)=>j===i?R[k]:x));
  const u=det(col(0))/D, w=det(col(1))/D, Lb=det(col(2))/D;
  const segs=[['S',v.run,1]].concat(v.c12.map(p=>[p[0],p[1]*u,p[2]]),[['S',Lb,1]],v.c34.map(p=>[p[0],p[1]*w,p[2]]),[['S',v.S,1]]);
  const pts=[[0,0]]; let x=0,y=0,h=0,carry=0; const ds=2;
  segs.forEach(p=>{ if(p[0]==='S'){ const l=p[1]; let d=ds-carry; while(d<=l){ pts.push([x+Math.cos(h)*d,y+Math.sin(h)*d]); d+=ds; } carry=(carry+l)%ds; x+=Math.cos(h)*l; y+=Math.sin(h)*l; }
    else { const R=p[1],ang=p[2]*Math.PI/180,l=R*ang,cx=x+Math.sin(h)*R,cy=y-Math.cos(h)*R; let d=ds-carry; while(d<=l){ const hh=h-d/R; pts.push([cx-Math.sin(hh)*R,cy+Math.cos(hh)*R]); d+=ds; } carry=(carry+l)%ds; const h2=h-ang; x=cx-Math.sin(h2)*R; y=cy+Math.cos(h2)*R; h=h2; } });
  const sb=v.run+u*a.len, sc=sb+Lb, sh=sc+w*b.len;
  return {pts,ds,marks:{c1:v.run,b:sb,c3:sc,h:sh}}; }
function courseGeom(r){ const c=COURSE[r.place]||COURSE['06'], dirt=r.surface==='ダ', t=dirt?c.dirt:c.turf, sgn=c.turn==='右'?-1:1;
  const v=loopFor(r), hsc=(v.H&&t.H)?v.H/t.H:1;          /* hsc: 内回りなど、高低差がその場の代表値と違う周回は高さを縮める */
  const C=v.C, L=v.S, lp=loopOf(v), P=lp.pts, n=P.length, M=lp.marks;
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9; P.forEach(p=>{ mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1]); });
  const ox=(mnx+mxx)/2, oy=(mny+mxy)/2;
  function raw(s){ s=((s%C)+C)%C; const f=s/lp.ds, i0=Math.floor(f)%n, i1=(i0+1)%n, tt=f-Math.floor(f); const A=P[i0], B=(i1===0?P[0]:P[i1]); return [A[0]+(B[0]-A[0])*tt-ox, A[1]+(B[1]-A[1])*tt-oy]; }
  function pos(s){ const p=raw(s); return [sgn*p[0],p[1]]; }
  function elev(s){ const f=(((s%C)+C)%C)/C, Q=c.prof; for(let i=0;i<Q.length-1;i++){ if(f>=Q[i][0]&&f<=Q[i+1][0]){ const tt=(f-Q[i][0])/(Q[i+1][0]-Q[i][0]||1); return (Q[i][1]+(Q[i+1][1]-Q[i][1])*tt)*hsc; } } return Q[0][1]*hsc; }

  /* 発走地点と引き込み線 */
  const D=+r.dist||0; let s0=((-D%C)+C)%C, chute=null; const ck=v.chute&&v.chute[D];
  if(ck){ let sj= ck==='back'?M.b : ck==='home'?M.h : (M.c1+(M.b-M.c1)*parseFloat(String(ck).split(':')[1]||'0.3')); let need=D-((C-sj)%C||C); while(need>C) need-=C;
    if(need>0&&need<520){ const J=pos(sj), J2=pos(sj+1), tx=J2[0]-J[0], ty=J2[1]-J[1], tl=Math.hypot(tx,ty)||1; chute={sj,len:need,J,T:[tx/tl,ty/tl]}; s0=sj-need; } }
  function rpos(s){ if(chute){ const q=s-s0; if(q<chute.len){ const d=chute.len-q; return [chute.J[0]-chute.T[0]*d, chute.J[1]-chute.T[1]*d]; } } return pos(s); }
  function relev(s){ return (chute&&(s-s0)<chute.len)?elev(chute.sj):elev(s); }
  function rzone(s){ return (chute&&(s-s0)<chute.len)?'引き込み線':zone(s); }
  let peak=0,pf=0; c.prof.forEach(p=>{if(p[1]>peak){peak=p[1];pf=p[0];}});
  let bx=(mxx-mnx)/2, bz=(mxy-mny)/2; if(chute){ const e=rpos(s0-40); bx=Math.max(bx,Math.abs(e[0])); bz=Math.max(bz,Math.abs(e[1])); }
  return {c,t,v,L,C,rad:bz,sgn,pos,elev,zone,rpos,relev,rzone,chute,s0,bx,bz,peakS:pf*C,H:(v.H||t.H),W:(dirt?25:28)}; }

/* 5. 結果・答え合わせ（K-buddy と同じ流れ: 1〜3着の人気・タイム → 全券種の払戻 → 買い目の的中と収支 → その日の合計） */
const PAYK=['単勝','複勝','枠連','馬連','ワイド','馬単','3連複','3連単'];
function payAll(res){ /* 全券種の払戻（100円あたり）。取り直す前の結果は単勝・複勝・ワイドだけ */
  if(!res) return null; if(res.pay_all) return res.pay_all; const o={}, p=res.pay||{};
  if(res.tansho&&res.order&&res.order.length) o['単勝']=[{c:String(res.order[0]),y:res.tansho}];
  if(p.fuku&&Object.keys(p.fuku).length) o['複勝']=Object.keys(p.fuku).map(u=>({c:u,y:p.fuku[u]}));
  if(p.wide&&Object.keys(p.wide).length) o['ワイド']=Object.keys(p.wide).map(c=>({c,y:p.wide[c]}));
  return Object.keys(o).length?o:null; }
function tkComb(t,hs){ const u=t.idx.map(i=>hs[i]&&hs[i].uno); return (t.type==='馬単'||t.type==='3連単')?u.join('>'):[...u].sort((a,b)=>a-b).join('-'); }
function tkHit(r,t){ /* 買い目の結果: 当たり={y:100円あたり,pop} / 返還={back:true} / 外れ=false / 払戻が取れていない券種=null */
  const res=r.result; const sc=(res&&res.scratch)||r.runners.filter(h=>h.scr).map(h=>h.uno); if(t.idx.some(i=>r.runners[i]&&sc.includes(r.runners[i].uno))) return {back:true}; if(!res) return null;
  const pa=payAll(res); if(!pa||!pa[t.type]) return null; const c=tkComb(t,r.runners); return pa[t.type].find(x=>String(x.c)===c)||false; }
function betSum(r){ /* そのレースの買い目リストの投資と払戻（金額は買い方で最後に出した配分） */
  if(!r||!r.result) return null; const L=(tkState(r.rid)[1].list||[]).filter(t=>t.yen>0); if(!L.length) return null;
  let inv=0, ret=0, hits=0, back=0, unk=0; L.forEach(t=>{ inv+=t.yen; const h=tkHit(r,t); if(h&&h.back){ back++; ret+=t.yen; } else if(h){ hits++; ret+=Math.round(t.yen/100*h.y); } else if(h===null) unk++; });

const yenS=v=>Math.round(v).toLocaleString()+'円', plS=v=>(v>=0?'+':'−')+Math.abs(Math.round(v)).toLocaleString()+'円';
function betLine(r){ const s=betSum(r); if(!s) return '';
  return `<div class="kres${s.ret>s.inv?' win':''}"><span>${s.hits?`的中 ${s.hits}点／購入${s.pts}点`:'この買い目は不的中'}${s.back?`<small>返還 ${s.back}点</small>`:''}${s.unk?`<small>${s.unk}点は払戻を取得中</small>`:''}</span><b class="mono">${yenS(s.inv)} → ${yenS(s.ret)}（${plS(s.ret-s.inv)}）</b></div>`; }
function dayLine(){ let inv=0, ret=0, n=0; RACES.forEach(r=>{ const s=betSum(r); if(s){ n++; inv+=s.inv; ret+=s.ret; } }); if(n<2) return '';
  return `<div class="note">この日の買い目（結果が出た${n}レース）　${yenS(inv)} → ${yenS(ret)}（${plS(ret-inv)}・回収率${Math.round(ret/inv*100)}%）</div>`; }
function rkCap(r,h){ /* 全頭の表の番の列: 馬番の丸の下に着順の札（3着まで）。着外は見えない札で形をそろえる */
  const o=(r.result&&r.result.order)||[], i=o.indexOf(h.uno), d=((r.result||{}).detail||{})[h.uno]||{}, k=i>=0&&i<3?(d.rank||i+1):0;

/* ---- 5 条件との相性（2026-10-03）: h.kt = 同じ芝ダの直近16走 [日付yymmdd, レース名, 場, 距離, 馬場, 人気, 着順, 着差, SF, 流れ, 4角, 頭数, 上がり差, 枠, クラス, 重賞]。条件は走ごとにここで決める ---- */
const KZ_LONG=new Set([5,4,9,7,8]), KZ_STEEP=new Set([6,9,7]), KZ_LEFT=new Set([5,7,4]);   /* 直線が長い場 / 急坂の場 / 左回りの場（JRA-VANの場コード） */

function kzStyle(x){ if(x.c4==null||!x.n) return null; const q=x.c4/x.n; return x.c4<=1?'逃げ':q<=0.3?'先行':q<=0.65?'差し':'追込'; }
function kzCond(x,r){ const o={}; const st=kzStyle(x); if(st) o['脚質']=st;

  o['直線']=KZ_LONG.has(x.pl)?'長い':'短い'; o['坂']=KZ_STEEP.has(x.pl)?'急坂':x.pl===5?'緩い坂':'平坦'; o['回り']=KZ_LEFT.has(x.pl)?'左':'右';
  if(x.waku!=null) o['枠']=x.waku<=3?'内':x.waku<=6?'中':'外';

function bindOrbit(){ const cv=T.cv; let lx=0,ly=0,drag=false,pd=0,two=false;
  cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'){drag=true;lx=e.clientX;ly=e.clientY;}});
  window.addEventListener('pointermove',e=>{if(!drag||!T)return;T.follow=false;T.az-=(e.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;placeCam();});
  window.addEventListener('pointerup',()=>drag=false);
  cv.addEventListener('wheel',e=>{e.preventDefault();T.zoom*=e.deltaY>0?0.9:1.1;T.follow=false;placeCam();},{passive:false});
  const td=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){two=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){two=true;pd=td(e.touches);}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();T.follow=false;if(e.touches.length===2){const d=td(e.touches);if(pd)T.zoom*=d/pd;pd=d;placeCam();}else if(e.touches.length===1&&!two){const t=e.touches[0];T.az-=(t.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(t.clientY-ly)*0.005));lx=t.clientX;ly=t.clientY;placeCam();}},{passive:false});
  cv.addEventListener('touchend',e=>{if(e.touches.length===0){two=false;pd=0;}}); }
/* 隊列ボード(線画): 横=先頭からの差(右が先頭)、縦=内(下)〜外(上) */
function drawFormation(){ const cv=document.getElementById('fm'); if(!cv||!S) return; const dpr=Math.min(2,window.devicePixelRatio||1), w=cv.parentElement.clientWidth||500, h=100; if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=h*dpr;cv.style.height=h+'px';}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); const hs=S.r.runners, padL=34,padR=14,top=10,bot=h-16;
  x.strokeStyle='#111'; x.lineWidth=1.5; x.strokeRect(padL+.75,top+.75,w-padL-padR-1.5,bot-top-1.5); x.setLineDash([3,4]); x.strokeStyle='#999'; x.lineWidth=1; x.beginPath(); x.moveTo(padL,(top+bot)/2); x.lineTo(w-padR,(top+bot)/2); x.stroke(); x.setLineDash([]);
  x.fillStyle='#666'; x.font='500 9px "DM Mono",monospace'; x.textAlign='right'; x.fillText('OUT',padL-6,top+10); x.fillText('IN',padL-6,bot-2);
  const pos=hs.map((h,i)=>{ const {s,lane}=horsePos(i,1); return {h,i,s,lane}; }); const smax=Math.max(...pos.map(p=>p.s)), span=Math.max(60,smax-Math.min(...pos.map(p=>p.s)));
  pos.sort((a,b)=>a.s-b.s).forEach(p=>{ const px=padL+12+(w-padL-padR-26)*(1-(smax-p.s)/span), py=bot-9-(bot-top-18)*p.lane; x.beginPath(); x.arc(px,py,8,0,Math.PI*2); x.fillStyle=WBG[p.h.waku]||'#999'; x.fill(); x.lineWidth=1.5; x.strokeStyle='#111'; x.stroke(); x.fillStyle=WFG[p.h.waku]||'#fff'; x.font='700 9px "DM Mono",monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(p.h.uno,px,py+.5); x.textBaseline='alphabetic'; });
  x.fillStyle='#111'; x.font='500 9px "DM Mono",monospace'; x.textAlign='left'; x.fillText(S.tracks?`GAP ${Math.round(span)}m`:'GATE',padL,bot+12); x.textAlign='right'; x.fillText('LEAD →',w-padR,bot+12); }
function draw(){ placeHorses(); }
