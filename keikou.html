const FM=(function(){

    ${mode==='past'&&fk.length?`<button type="button" class="ys" data-go="s-yr" aria-label="年ごとの最高着順を見る"><span class="yl0">年ごと</span><span class="cells">${yr.map(y=>{ const b=best[y]; return `<i class="${b===1?'w':b<=3?'p':b?'x':''}"></i>`; }).join('')}</span><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2.5 1.5L8 8l-5.5 6.5"/></svg></button>`:''}
    ${mode==='ent'&&sk.length?`<p class="skip tx">${esc(sk.join('、'))}は前もって分からないので、今年の馬はこの条件を外しています</p>`:''}</div>`;
  let body='', secs=[];
  if(mode==='past'){
    const list=xs.slice().sort((p,q)=>q.y-p.y||p.f-q.f); const lim=more?list.length:40;
    const sf1=secFlow(r), sp=secPos(r), sb=secBlood(r,per);
    secs=[[sf1,'s-flow','流れ'],[sp,'s-pos','位置'],[sb,'s-blood','血統'],[1,'s-cut','絞り込み']].filter(v=>v[0]).map(v=>[v[1],v[2]]);
    body=sf1+sp+sb+`<section class="sec" id="s-cut"><p class="sl">FILTER</p><h2>条件で絞り込む</h2><p class="s2 tx"><span class="pz">上の枠で条件を選ぶと、</span><span class="pz">下に当てはまる馬の成績が出ます</span></p>${cond}
    <div class="card bk rv"><div class="hd2"><b>${esc(a.l)}ごと</b><span>${gs.reduce((p,g)=>p+g.n,0)}頭</span></div>
      ${a.note&&a.note(r)?`<p class="hint tx">${esc(a.note(r))}</p>`:''}
      <div class="lg"><span><i></i>3着内率</span><span><i class="e"></i>人気から想定される3着内率</span></div>
      ${gs.filter(g=>g.n).length?gs.filter(g=>g.n).map((g,i)=>{ const [cls,tag]=verdict(g); const on=F[a.k]&&F[a.k].has(g.g);
        return `<button type="button" class="gr ${cls}${on?' on':''}" data-g="${esc(g.g)}"><div class="l1"><b>${esc(lab(a,g.g))}</b><span class="r">${pct(g.t3,g.n)}<small>%</small></span></div>
        <div class="bar"><i style="width:${(g.a/mx*100).toFixed(1)}%;transition-delay:${(i*.05).toFixed(2)}s"></i>${g.e!=null?`<s style="left:${(g.e/mx*100).toFixed(1)}%"></s>`:''}</div>
        <div class="l2"><span class="cnt">${its([`<b>${g.n}</b>頭中<b>${g.t3}</b>頭が3着内`,`<b>${g.w}</b>勝`,g.e!=null?`人気からの想定<b>${Math.round(g.e*100)}</b>%`:''])}</span><span class="tag">${tag}</span></div></button>`; }).join(''):'<p class="hint">この条件に当てはまる馬がいません</p>'}
      <p class="hint">10頭未満は「頭数が少ない」（たまたまの差が出やすい）</p></div>
    <div class="card" id="s-yr"><p class="h3">年ごとの最高着順</p><p class="sub3 tx">いまの条件に当てはまった馬の、その年でいちばん良い着順です</p>${fk.length?`<div class="yg">${yr.map(y=>{ const b=best[y]; return `<div class="yc ${b===1?'w':b<=3?'p':b?'x':''}"><span>${y}</span><b>${b||'－'}</b></div>`; }).join('')}</div>
      <div class="yl"><span><i></i>勝った</span><span><i class="p"></i>2〜3着</span><span><i class="x"></i>4着以下</span><span>－ 当てはまる馬なし</span></div>`:'<p class="hint">組を押すと、当てはまった馬の年ごとの最高着順</p>'}</div>
    <div class="card"><p class="h3">当てはまった馬</p><p class="sub3">${S.n}頭・新しい年から</p><div class="hl">${list.slice(0,lim).map(x=>`<div class="hr"><span class="y">${x.y}</span><div class="nm"><b>${esc(x.h)}</b><small>${its([`${esc(x.s)}${x.a} ${x.k}kg`,(x.pn||x.pg)&&x.pf?`前走 ${esc(x.pn||x.pg)} ${x.pf}着`:''])}</small></div><div class="fn"><span>${x.p||'-'}人気</span><b class="${x.f===1?'w':x.f<=3?'p':''}">${x.f}着</b></div></div>`).join('')}</div>
      ${list.length>lim?`<button type="button" class="more" data-more>残り${list.length-lim}頭を見る</button>`:''}</div></section>`;
  } else {
    secs=[['s-front','隊列とペース'],['s-ent',emode==='horse'?'馬ごと':'条件ごと']];
    const tg=`<div class="seg2 em">${[['horse','馬ごと'],['angle','条件ごと']].map(([k,l])=>`<button type="button" data-em="${k}" class="${emode===k?'on':''}">${l}</button>`).join('')}</div>`;
    let h='';
    if(emode==='horse'){
      h=`<p class="hint tx et"><span class="pz">馬を押すとカルテが開きます。</span><span class="pz">札＝当てはまる条件のうち、</span><span class="pz">3着内が人気からの想定より多い（少ない）条件の数</span></p>${E.length?`<div class="hl">${E.map(x=>rowEnt(x,r)).join('')}</div>`:'<p class="hint">いまの条件に当てはまる今年の馬はいません</p>'}`;
      body=secFront(r)+`<section class="sec" id="s-ent"><p class="sl">THIS YEAR</p><h2><span class="pz">今年の${esc(stl)}</span></h2><p class="s2 tx">${esc(mdt)}の${ne}頭</p>${tg}${cond}<div class="card rv">${h}</div></section>`;
    } else {
      if(unk(a.k,r)){
        h=`<p class="hint tx">${['ninki','odds'].includes(a.k)?'この条件は当日まで分からないので、今年の馬は分けられません':LATER.has(a.k)?'この条件はレースが終わるまで分からないので、今年の馬は分けられません':'枠と馬番は、枠順が出てから分けます'}</p>${E.length?`<div class="hl">${E.map(x=>rowEnt(x,r)).join('')}</div>`:''}`;
      } else {
        const eg={}; (r.ent||[]).filter(x=>epass(x,r,a.k)).forEach(x=>{ const g=a.fn(x,r); const k=g==null?'？':g; (eg[k]=eg[k]||[]).push(x); });
        const order=gs.map(g=>g.g).concat(Object.keys(eg).filter(g=>!gs.some(q=>q.g===g)));
        const sel=F[a.k]&&F[a.k].size?F[a.k]:null;
        h=order.filter(g=>eg[g]).map(g=>{ const gp=gs.find(q=>q.g===g&&q.n); const [cls,tag]=gp?verdict(gp):['few','過去の馬なし']; const on=sel&&sel.has(g), off=sel&&!on;
          return `<div class="eg${off?' off':''}"><button type="button" class="gr egh ${cls}${on?' on':''}" data-g="${esc(g)}"><div class="l1"><b>${g==='？'?'わからない':esc(lab(a,g))}<span class="en">今年 ${eg[g].length}頭</span></b><span class="r">${gp?pct(gp.t3,gp.n):'－'}<small>${gp?'%':''}</small></span></div>
            <div class="l2"><span class="cnt">${its([`過去 <b>${gp?gp.n:0}</b>頭中<b>${gp?gp.t3:0}</b>頭が3着内`,gp&&gp.e!=null?`人気からの想定<b>${Math.round(gp.e*100)}</b>%`:''])}</span><span class="tag">${tag}</span></div></button>
            ${off?'':`<div class="hl">${eg[g].map(x=>rowEnt(x,r)).join('')}</div>`}</div>`; }).join('');
        const none=gs.filter(g=>g.n&&!eg[g.g]).map(g=>lab(a,g.g));
        if(none.length) h+=`<p class="hint">${its(['今年の馬がいない組',...none.map(v=>esc(v))])}</p>`;
      }
      body=secFront(r)+`<section class="sec" id="s-ent"><p class="sl">THIS YEAR</p><h2><span class="pz">今年の${esc(stl)}</span></h2><p class="s2 tx"><span class="pz">${esc(mdt)}の${ne}頭。</span><span class="pz">組を押すと、その条件の馬だけに絞り込めます</span></p>${tg}${cond}<div class="card rv">${h||'<p class="hint">いまの条件に当てはまる今年の馬はいません</p>'}</div></section>`;
    }
  }
  app.innerHTML=`<section class="hero"><span class="eyebrow">今週の重賞分析 ${esc(W.week)}</span>
  <div class="tabs">${W.races.map((x,i)=>`<button type="button" data-i="${i}" class="${i===cur?'on':''}">${esc(x.short)}<small>${esc(x.md)}</small></button>`).join('')}</div>
  <div class="rh"><h1>${esc(r.name)}</h1><span class="gb">${esc(r.grade)}</span></div>
  <div class="rm">${its([`${esc(r.md)} ${esc(r.place)}${r.R}R`,`${r.sf==='芝'?'芝':'ダート'}${r.dist}m`,r.handi?'ハンデ':''])}</div>
  <p class="scope tx"><span class="pz">${esc(r.place)}の${r.sf==='芝'?'芝':'ダート'}${r.dist}mで行われた</span><span class="pz">${FYp(r).length}回（${yr[0]}〜${yr[yr.length-1]}年）の</span><span class="pz">${RN(r).length}頭が対象です</span></p>
  ${exTxt(r)}
  ${per('top')}
  <div class="mode"><button type="button" data-m="past" class="${mode==='past'?'on':''}">過去の傾向<small>${FYp(r).length}回 ${RN(r).length}頭</small></button><button type="button" data-m="ent" class="${mode==='ent'?'on':''}"${ne?'':' disabled'}>今年の${r.status==='登録'?'登録馬':'出走馬'}<small>${ne?`${ne}頭 ${esc(mdt)}`:'まだ出ていません'}</small></button></div></section>
  ${navHtml(secs,ne)}
  ${body}
  <details class="how"><summary>見かた</summary>
    <p class="tx">持続と瞬発（芝）: 最後の1200mで、200mごとの時計が12.0秒を切った区間が何本続いたかで分けています。4本以上が持続、3本以下が瞬発、1本もない年が「11秒台なし」です。時計は馬場差を引いてから数えるので、速い馬場で11秒台が並んだだけの年は持続になりません。</p>
    <p class="tx">前半の速さ: 前半1000m（最初が100mのコースは1100m）の時計から馬場差を引き、このレースの過去の真ん中の値より0.5秒以上速ければ「速い」、0.5秒以上遅ければ「遅い」です。今年の馬の過去のレースは、同じコースと同じクラスの真ん中の値と比べています。</p>
    <p class="tx">3着内率: その組の馬のうち、このレースで3着以内だった馬の割合です。</p>
    <p class="tx">人気からの想定: その馬と同じくらいの単勝オッズの馬が、ふだん3着以内に来ている割合です。1レースで3頭になるようにそろえています。3着内率がこれよりはっきり高い組を「想定より3着内が多い」、低い組を「想定より3着内が少ない」と出します（10頭以上の組だけ）。</p>
    <p class="tx">血統: 同じ競馬場、同じ芝ダートで距離の近いコースの、全クラスの成績です。</p>
    <p class="tx">想定隊列: 近5走の4角の位置（頭数の中で前から何割のところか）の真ん中の値で並べています。先行馬＝この真ん中の値が前から2割以内の馬（隊列で名前が紺）。過去の年も同じ物差しで数えています。</p>
    <p class="tx">中○日: 前走の日と、このレースの日のあいだの日数です。ダートのレースは、前走に地方や海外のレースも入れています。</p>
    <p class="tx">今年の馬: 登録馬は月曜に、出走馬は木曜の出馬投票のあとに、枠順はそれが出たあとに作り直します。人気、オッズ、レースの中の位置と流れは前もって分からないので、今年の馬はその条件を外して見ます。</p>
    <p class="tx">3着内が多い条件と少ない条件: 今年の馬が当てはまる条件ごとに、過去の3着内率が人気からの想定より高いか低いかを数えたものです。前走の格と前走のレースのように、同じことを別の条件で数えているものもあります。</p>
    <p class="tx">過去のレースの数字です。これからの結果を約束するものではありません。</p></details>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ cur=+b.dataset.i; F={}; more=0; opn=new Set(); fsel=null; fall=0; bmore=0; render(); });
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; mode=b.dataset.m; if(mode==='ent'&&emode==='angle'&&unk(ang,r)) ang=['pg','pn','pf','age','sex'].find(k=>usable(AK[k],r))||ang; render(true); toTop(); });
  const rs=app.querySelector('select.rs'); if(rs) rs.onchange=()=>{ cur=+rs.value; F={}; more=0; opn=new Set(); fsel=null; fall=0; bmore=0; render(true); toTop(); };
  app.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>{ emode=b.dataset.em; if(emode==='angle'&&unk(ang,r)) ang=['pg','pn','pf','age','sex'].find(k=>usable(AK[k],r))||ang; render(true); });
  app.querySelectorAll('.hr.eh').forEach(b=>b.onclick=()=>{ const h=b.dataset.h; opn.has(h)?opn.delete(h):opn.add(h); render(true); });
  app.querySelectorAll('select.ps').forEach(sl=>sl.onchange=()=>{ ang=sl.value; render(true); showGroups(); });
  app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ const ks=[...app.querySelectorAll('select.ps option')].map(o=>o.value), i=Math.max(0,ks.indexOf(ang)); ang=ks[(i+(+b.dataset.step)+ks.length)%ks.length]; render(true); showGroups(); });
  app.querySelectorAll('.gr').forEach(b=>b.onclick=()=>{ const g=b.dataset.g; if(g==='？') return; const s=F[ang]=F[ang]||new Set(); s.has(g)?s.delete(g):s.add(g); more=0; render(true); });
  app.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{ F[b.dataset.k].delete(b.dataset.g); render(true); });
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>jump(b.dataset.go));
  const ssl=app.querySelector('select.ss'); if(ssl) ssl.onchange=()=>jump(ssl.value);
  app.querySelectorAll('[data-fy]').forEach(b=>b.onclick=()=>{ const y=+b.dataset.fy; fsel=fsel===y?null:y; if((r.fy||[]).filter(o=>o.laps).findIndex(o=>o.y===y)>=6) fall=1; render(true); });
  app.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{ pmx=b.dataset.pm; render(true); });
  app.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>{ bk=b.dataset.bk; bmore=0; render(true); });
  app.querySelectorAll('[data-bs]').forEach(b=>b.onclick=()=>{ bsort=b.dataset.bs; bmore=0; render(true); });
  const c=app.querySelector('[data-clr]'); if(c) c.onclick=()=>{ F={}; YR=null; render(true); };
  app.querySelectorAll('select[data-yr]').forEach(sl=>sl.onchange=()=>{ const ss=sl.parentNode.querySelectorAll('select[data-yr]'); let a=+ss[0].value, b=+ss[1].value; if(a>b) [a,b]=[b,a];
    YR=(a<=yrA0(r)&&b>=yrA1(r))?null:[a,b]; more=0; fall=0; fsel=null; bmore=0; render(true); });
  app.querySelectorAll('[data-yrc]').forEach(b=>b.onclick=()=>{ YR=null; more=0; fall=0; render(true); });
  const m=app.querySelector('[data-more]'); if(m) m.onclick=()=>{ more=1; render(true); };
  const fa=app.querySelector('[data-fall]'); if(fa) fa.onclick=()=>{ fall=1; render(true); };
  const bm=app.querySelector('[data-bmore]'); if(bm) bm.onclick=()=>{ bmore=1; render(true); };
  const els=[...app.querySelectorAll('.rv')];
  if(reduce||keep){ els.forEach(e=>e.classList.add('in')); }
  else{ const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.12}); els.forEach(e=>io.observe(e)); }
  if(!reduce) app.querySelectorAll('.gr .bar i').forEach(i=>{ i.style.transform='scaleX(0)'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ i.style.transform=''; })); });
  spy();
}
 
let navStuck=false;
const hh=()=>{ const t=document.querySelector('.top'); return t?t.getBoundingClientRect().height:54; };
const navHtml=(secs,ne)=>`<div id="nav-sent"></div><nav class="nav2${navStuck?' stuck':''}" id="nav2" aria-label="目次"><select class="stk rs" aria-label="レースをえらぶ">${W.races.map((x,i)=>`<option value="${i}"${i===cur?' selected':''}>${esc(x.short)}</option>`).join('')}</select><span class="stk seg3">${[['past','過去'],['ent','今年']].map(([k,l])=>`<button type="button" data-m="${k}" class="${mode===k?'on':''}"${k==='ent'&&!ne?' disabled':''}>${l}</button>`).join('')}</span><select class="stk ss" aria-label="章をえらぶ">${secs.map(([id,l])=>`<option value="${id}">${l}</option>`).join('')}</select><span class="chips">${secs.map(([id,l])=>`<button type="button" data-go="${id}">${l}</button>`).join('')}</span></nav>`;
function spy(){ const n=document.getElementById('nav2'), s=document.getElementById('nav-sent'); if(!n||!s) return; const h=hh();
  document.documentElement.style.setProperty('--hh',h+'px');
  navStuck=s.getBoundingClientRect().top+12<=h+1; n.classList.toggle('stuck',navStuck);
  const cd=document.querySelector('#app .cond'), ch=cd?cd.offsetHeight+6:0;
  const bs=[...n.querySelectorAll('.chips button')], base=h+n.offsetHeight+48; let on=null;
  bs.forEach(b=>{ const t=document.getElementById(b.dataset.go); if(!t) return; const lim=base+(cd&&(cd.compareDocumentPosition(t)&Node.DOCUMENT_POSITION_FOLLOWING)?ch:0); if(t.getBoundingClientRect().top<=lim) on=b; });
  bs.forEach(b=>b.classList.toggle('on',b===on));
  const ss=n.querySelector('select.ss'); if(ss&&on&&ss.value!==on.dataset.go) ss.value=on.dataset.go;
  if(on&&on!==spy.el){ const p=on.parentNode; if(on.offsetLeft<p.scrollLeft+8||on.offsetLeft+on.offsetWidth>p.scrollLeft+p.clientWidth-16) p.scrollTo({left:Math.max(0,on.offsetLeft-8),behavior:(reduce||on.textContent===spy.last)?'auto':'smooth'}); }
  spy.el=on; spy.last=on?on.textContent:null; }
addEventListener('scroll',()=>{ if(!spy.q){ spy.q=1; requestAnimationFrame(()=>{ spy.q=0; spy(); }); } },{passive:true});
addEventListener('resize',()=>spy());
function showGroups(){ const c=document.querySelector('#s-cut .card.bk')||document.querySelector('#s-ent .card.rv'), cd=document.querySelector('#app .cond'); if(!c||!cd) return;
  const n=document.getElementById('nav2'), want=hh()+(n?n.offsetHeight:44)+cd.offsetHeight+8, top=c.getBoundingClientRect().top;   
  if(top<want-1||top>innerHeight-160) window.scrollTo({top:scrollY+top-want}); spy(); }
function toTop(){ const s=document.getElementById('nav-sent'); if(!s) return; const y=s.getBoundingClientRect().top+scrollY+12-hh(); if(scrollY>y) window.scrollTo({top:y}); spy(); }
function jump(id){ const t=document.getElementById(id), n=document.getElementById('nav2'); if(!t) return; const cd=document.querySelector('#app .cond');
  let off=hh()+(n?n.offsetHeight:0)+10; if(cd&&(cd.compareDocumentPosition(t)&Node.DOCUMENT_POSITION_FOLLOWING)) off+=cd.offsetHeight+6;
  window.scrollTo({top:t.getBoundingClientRect().top+scrollY-off,behavior:reduce?'auto':'smooth'}); }
 
function fromHash(){ const h=new URLSearchParams(location.hash.slice(1)); const ri=W.races.findIndex(x=>x.rid===h.get('rid')); if(ri>=0&&ri!==cur){ cur=ri; F={}; more=0; opn=new Set(); fsel=null; fall=0; bmore=0; return true; } return false; }
 
const isDk=()=>document.documentElement.getAttribute('data-theme')==='dark';
function thmSet(){ const b=document.getElementById('thmb'); if(!b) return; b.setAttribute('aria-label',isDk()?'明るい画面にする':'暗い画面にする'); b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${isDk()?'sun':'moon'}"/></svg>`; }
const thb=document.getElementById('thmb'); if(thb) thb.onclick=()=>{ const dk=!isDk(); if(dk) document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem('umami_theme',dk?'dark':'light'); }catch(e){} thmSet(); };
thmSet();
fromHash(); render();
addEventListener('hashchange',()=>{ if(fromHash()) render(); });
})();
</script>
