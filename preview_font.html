/* ===== 合い言葉 ===== */
function b64d(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function decrypt(pw){const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(PAID.salt),iterations:PAID.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAID.iv)},key,b64d(PAID.ct)); return JSON.parse(new TextDecoder().decode(pt));}
async function tryUnlock(pw,remember){
  try{ const paid=await decrypt(pw); member=true;
    Object.entries(paid.races).forEach(([rid,pr])=>{ const r=byRid[rid]; if(!r) return; r.load_rate=pr.load_rate; r.nige=pr.nige; r.pace_z=pr.pace_z; r.pace_pf=pr.pace_pf; r.pace_cls=pr.pace_cls; r.pace_pos=pr.pace_pos; r.pace_p=pr.pace_p; const m={}; pr.runners.forEach(x=>m[x.uno]=x); r.runners.forEach(h=>Object.assign(h,m[h.uno]||{})); });
    if(remember) ls.set(LSK,{pw,d:FREE.date});
    renderAll(); return true; }catch(e){ return false; }
}
function lockBox(msg){ return `<div class="lock">${ico('lock')}<p>${esc(msg)}</p><div class="pw"><input type="password" placeholder="合い言葉" autocomplete="off" onkeydown="if(event.key==='Enter')unlockFrom(this)"><button onclick="unlockFrom(this.previousElementSibling)">解錠</button></div><div class="er">合い言葉が違います</div><div class="n">合い言葉はnoteの限定記事で毎月発表</div></div>`; }
async function unlockFrom(inp){ const box=inp.closest('.lock'); const ok=await tryUnlock(inp.value.trim(),true); if(!ok){ box.querySelector('.er').style.display='block'; } }

function buildTrack3D(){ const g=S.geo, r=S.r, dirt=r.surface==='ダ'; const EX=18; g.EX=EX; const hT=s=>g.elev(s)*EX, hD=s=>g.elev(s)*EX*0.9-1.5;

function horsePos(i,gapx){ const g=S.geo,h=S.r.runners[i]; let s,lane; if(!S.tracks){ s=g.s0-(h.uno-1)*3.2*gapx; lane=((h.waku||4)-1)/7; } else { s=g.s0+Math.max(0,S.tracks.lead(S.t)-S.tracks.gap(i,S.t)*gapx); lane=S.tracks.lane(i,S.t); } return {s,lane}; }

  window.addEventListener('pointermove',e=>{if(!drag||!T)return;T.follow=false;T.az-=(e.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;placeCam();});
  window.addEventListener('pointerup',()=>drag=false);
  cv.addEventListener('wheel',e=>{e.preventDefault();T.zoom*=e.deltaY>0?0.9:1.1;T.follow=false;placeCam();},{passive:false});
  const td=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){two=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){two=true;pd=td(e.touches);}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();T.follow=false;if(e.touches.length===2){const d=td(e.touches);if(pd)T.zoom*=d/pd;pd=d;placeCam();}else if(e.touches.length===1&&!two){const t=e.touches[0];T.az-=(t.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(t.clientY-ly)*0.005));lx=t.clientX;ly=t.clientY;placeCam();}},{passive:false});
  cv.addEventListener('touchend',e=>{if(e.touches.length===0){two=false;pd=0;}}); }
/* 隊列ボード(線画): 横=先頭からの差(右が先頭)、縦=内(下)〜外(上) */
function drawFormation(){ const cv=document.getElementById('fm'); if(!cv||!S) return; const dpr=Math.min(2,window.devicePixelRatio||1), w=cv.parentElement.clientWidth||500, h=100; if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=h*dpr;cv.style.height=h+'px';}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); const hs=S.r.runners, padL=34,padR=14,top=10,bot=h-16;
  x.strokeStyle='#111'; x.lineWidth=1.5; x.strokeRect(padL+.75,top+.75,w-padL-padR-1.5,bot-top-1.5); x.setLineDash([3,4]); x.strokeStyle='#999'; x.lineWidth=1; x.beginPath(); x.moveTo(padL,(top+bot)/2); x.lineTo(w-padR,(top+bot)/2); x.stroke(); x.setLineDash([]);
  x.fillStyle='#666'; x.font='500 9px "DM Mono",monospace'; x.textAlign='right'; x.fillText('OUT',padL-6,top+10); x.fillText('IN',padL-6,bot-2);
  const pos=hs.map((h,i)=>{ const {s,lane}=horsePos(i,1); return {h,i,s,lane}; }); const smax=Math.max(...pos.map(p=>p.s)), span=Math.max(60,smax-Math.min(...pos.map(p=>p.s)));
  pos.sort((a,b)=>a.s-b.s).forEach(p=>{ const px=padL+12+(w-padL-padR-26)*(1-(smax-p.s)/span), py=bot-9-(bot-top-18)*p.lane; x.beginPath(); x.arc(px,py,8,0,Math.PI*2); x.fillStyle=WBG[p.h.waku]||'#999'; x.fill(); x.lineWidth=1.5; x.strokeStyle='#111'; x.stroke(); x.fillStyle=WFG[p.h.waku]||'#fff'; x.font='700 9px "DM Mono",monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(p.h.uno,px,py+.5); x.textBaseline='alphabetic'; });
  x.fillStyle='#111'; x.font='500 9px "DM Mono",monospace'; x.textAlign='left'; x.fillText(S.tracks?`GAP ${Math.round(span)}m`:'GATE',padL,bot+12); x.textAlign='right'; x.fillText('LEAD →',w-padR,bot+12); }
function draw(){ placeHorses(); }
/* ===== 3D END ===== */
</script>

<div id="fp"><div class="bd">

</div><button class="tab" id="fp-tab">見た目を変える</button></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const hex=c=>{c=c.replace('#','');return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16));};
  const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return toHex([0,1,2].map(i=>A[i]+(B[i]-A[i])*t));};
  const FONTS={
    cur:{n:'今のまま（M PLUS Rounded 1c）'},
    zenmaru:{n:'Zen Maru Gothic',css:"'Zen Maru Gothic'",g:'Zen+Maru+Gothic:wght@300;400;500;700;900'},
    hiramaru:{n:'ヒラギノ丸ゴ＋Zen Maru',css:"'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','Zen Maru Gothic'",g:'Zen+Maru+Gothic:wght@300;400;500;700;900'},
    mplus:{n:'M PLUS Rounded 1c（細い太さも）',css:"'M PLUS Rounded 1c'",g:'M+PLUS+Rounded+1c:wght@300;400;500;700;800'},
    kosugi:{n:'Kosugi Maru',css:"'Kosugi Maru'",g:'Kosugi+Maru'},
    kiwi:{n:'Kiwi Maru',css:"'Kiwi Maru'",g:'Kiwi+Maru:wght@300;400;500'},
    zenkaku:{n:'Zen Kaku Gothic New（角ゴ）',css:"'Zen Kaku Gothic New'",g:'Zen+Kaku+Gothic+New:wght@300;400;500;700;900'}
  };
  const WMAP=[null,{900:700,800:700,700:500,600:500,500:400},{900:500,800:500,700:400,600:400,500:300}];
  const DEF={font:'cur',w:0,logo:0,ink:'#111111',acc:'#111111',bg2:'#fafaf7',bg:'#ffffff',g:'#e8f3e3',y:'#fbf3d9',b:'#e6f0f8',p:'#f6e6ec'};
  const PRE=[
    {n:'今のまま（白黒）',ink:'#111111',acc:'#111111',bg2:'#fafaf7',bg:'#ffffff',g:'#e8f3e3',y:'#fbf3d9',b:'#e6f0f8',p:'#f6e6ec'},
    {n:'サムネの色味（生成り×若草）',ink:'#2b2b28',acc:'#5f8f6b',bg2:'#faf8f2',bg:'#ffffff',g:'#dfeeda',y:'#f7efd6',b:'#e3eef0',p:'#f5e4e0'},
    {n:'生成り×墨',ink:'#2a2622',acc:'#2a2622',bg2:'#f6f1e7',bg:'#fffdf8',g:'#e6efdc',y:'#f8edcf',b:'#e4ecef',p:'#f4e2df'},
    {n:'ネイビー',ink:'#1f2d4d',acc:'#2f4b8a',bg2:'#f4f6fb',bg:'#ffffff',g:'#e2f0ea',y:'#fbf1d6',b:'#e1eafa',p:'#f7e4ec'},
    {n:'あずき×クリーム',ink:'#3a2a2a',acc:'#8c4a4f',bg2:'#fbf6f0',bg:'#ffffff',g:'#e7f0e0',y:'#faecd0',b:'#e6edf3',p:'#f6dfe2'},
    {n:'ミント',ink:'#203a36',acc:'#2f8f7d',bg2:'#f3faf8',bg:'#ffffff',g:'#d9f1e7',y:'#f9f1d4',b:'#def0f4',p:'#f7e3ea'},
    {n:'さくら',ink:'#3b2b33',acc:'#d0708f',bg2:'#fdf6f8',bg:'#ffffff',g:'#e6f1e2',y:'#fbefd6',b:'#e8eef7',p:'#fbdfe8'}
  ];
  let st=Object.assign({},DEF);
  const base=document.querySelector('style'); const ORIG=base.textContent;
  Object.keys(FONTS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=FONTS[k].n;$('fp-font').appendChild(o);});
  PRE.forEach(p=>{const b=document.createElement('button');b.innerHTML='<i style="background:'+p.acc+'"></i><i style="background:'+p.bg2+'"></i>'+p.n;b.onclick=()=>{const keep={font:st.font,w:st.w,logo:st.logo};st=Object.assign({},DEF,p,keep);delete st.n;apply();};$('fp-pre').appendChild(b);});
  function apply(){
    const f=FONTS[st.font]||FONTS.cur;
    let lk=$('fp-link'); if(!lk){lk=document.createElement('link');lk.id='fp-link';lk.rel='stylesheet';document.head.appendChild(lk);}
    if(f.g) lk.href='https://fonts.googleapis.com/css2?family='+f.g+'&display=swap'; else lk.removeAttribute('href');
    // 元のCSSを加工: 直書きの黒/白を変数に、黒地の面は「主役の色」に、太さは対応表で置き換え
    let css0=ORIG.replace(/background(-color)?:\s*var\(--ink\)/g,'background$1:var(--acc)').replace(/background(-color)?:\s*(#111111|#111)\b/g,'background$1:var(--acc)')
                 .replace(/#111111\b|#111\b/g,'var(--ink)').replace(/#ffffff\b|#fff\b/gi,'var(--bg)');
    const m=WMAP[st.w]; if(m) css0=css0.replace(/font-weight:\s*(\d{3})/g,(a,n)=>'font-weight:'+(m[n]||n));
    base.textContent=css0;
    let el=$('fp-style'); if(!el){el=document.createElement('style');el.id='fp-style';document.head.appendChild(el);}
    let css=':root{--ink:'+st.ink+';--acc:'+st.acc+';--bg:'+st.bg+';--bg2:'+st.bg2+';--g:'+st.g+';--y:'+st.y+';--b:'+st.b+';--p:'+st.p+';--mute:'+mix(st.ink,st.bg2,.42)+';--soft:'+mix(st.ink,st.bg2,.6)+';--gr:'+mix(st.bg2,st.ink,.07)+';}\n';
    css+='svg.ic{stroke:var(--ink);}\n.nav button.on svg.ic{stroke:var(--acc);}.nav button.on{color:var(--acc);}\n';
    if(f.css){ css+='body{font-family:'+f.css+",'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',Meiryo,sans-serif;}\n"; if(st.logo) css+='.hd .wm .kana{font-family:'+f.css+",'M PLUS Rounded 1c',sans-serif !important;}\n"; }
    if(m) css+='body{font-weight:'+(st.w===2?300:400)+';}\n';
    css+='#fp, #fp *{font-family:system-ui,sans-serif !important;} #fp .bd{background:#fff;color:#111;border-color:#111} #fp .tab,#fp .act button{background:#111;color:#fff} #fp .act button.sub{background:#fff;color:#111}\n';
    el.textContent=css;
    ['ink','acc','bg2','bg','g','y','b','p'].forEach(k=>$('fp-'+k).value=st[k]);
    $('fp-font').value=st.font; $('fp-w').value=String(st.w); $('fp-logo').checked=!!st.logo;
    const h='font='+st.font+'&w='+st.w+'&logo='+(st.logo?1:0)+['ink','acc','bg2','bg','g','y','b','p'].map(k=>'&'+k+'='+st[k].slice(1)).join('');
    try{history.replaceState(null,'','#'+h);}catch(e){} $('fp-code').textContent=h;
  }
  (location.hash.replace('#','')||'').split('&').forEach(kv=>{const [k,v]=kv.split('='); if(!k||v==null) return;
    if(k==='font'&&FONTS[v]) st.font=v; else if(k==='w') st.w=Math.max(0,Math.min(2,parseInt(v,10)||0)); else if(k==='logo') st.logo=v==='1'?1:0; else if(k in DEF&&/^[0-9a-fA-F]{6}$/.test(v)) st[k]='#'+v;});
  ['ink','acc','bg2','bg','g','y','b','p'].forEach(k=>$('fp-'+k).addEventListener('input',e=>{st[k]=e.target.value;apply();}));
  $('fp-font').onchange=e=>{st.font=e.target.value;apply();}; $('fp-w').onchange=e=>{st.w=parseInt(e.target.value,10)||0;apply();}; $('fp-logo').onchange=e=>{st.logo=e.target.checked?1:0;apply();};
  $('fp-tab').onclick=()=>$('fp').classList.toggle('open');
  $('fp-reset').onclick=()=>{st=Object.assign({},DEF);apply();};
  $('fp-copy').onclick=()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{$('fp-copy').textContent='コピーしました';setTimeout(()=>$('fp-copy').textContent='この設定のURLをコピー',1500);}).catch(()=>prompt('このURLをコピーしてください',u));};
  apply();
})();
</script>
